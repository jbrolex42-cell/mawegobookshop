
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126b45">
  <meta name="description" content="Official Mawego Bookshop purchase receipt.">
  <title>Purchase Receipt | Mawego Bookshop</title>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://unpkg.com/lucide@0.469.0"></script>

  <style>
    :root {
      --green: #126b45;
      --green-dark: #0c4930;
      --green-light: #eaf6ef;
      --ink: #17251e;
      --muted: #718078;
      --line: #e5ebe7;
      --surface: #ffffff;
      --page: #f3f7f4;
      --danger: #b42318;
      --warning: #a15c00;
      --blue: #175cd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    .receipt-page {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 65px;
    }

    .receipt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .receipt-toolbar a,
    .receipt-toolbar button {
      text-decoration: none;
    }

    .receipt-toolbar .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      border-radius: 9px;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .receipt-paper {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid #e2eae4;
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(19, 54, 35, 0.08);
    }

    .receipt-top-accent {
      height: 7px;
      background: linear-gradient(90deg, var(--green-dark), #249b62);
    }

    .receipt-inner {
      padding: 42px 48px;
    }

    .receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 25px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      border-radius: 14px;
    }

    .brand-icon i {
      width: 26px;
      height: 26px;
    }

    .brand-name {
      margin: 0;
      color: var(--green-dark);
      font-size: 21px;
      font-weight: 850;
      letter-spacing: -0.7px;
    }

    .brand-tagline {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .receipt-heading {
      text-align: right;
    }

    .receipt-heading h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -0.8px;
      color: var(--ink);
    }

    .receipt-heading p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .receipt-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }

    .receipt-number-label,
    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .receipt-number {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 850;
      color: var(--green-dark);
      overflow-wrap: anywhere;
    }

    .receipt-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-wrap {
      text-align: right;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .status-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-paid {
      background: #e9f8ef;
      color: #167443;
    }

    .status-pending {
      background: #fff4df;
      color: var(--warning);
    }

    .status-failed,
    .status-refunded {
      background: #fff0ef;
      color: var(--danger);
    }

    .status-unknown {
      background: #eef2f0;
      color: #59675f;
    }

    .receipt-section {
      padding: 27px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 19px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .9px;
    }

    .section-title i {
      width: 17px;
      height: 17px;
      color: var(--green);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 35px;
    }

    .info-item {
      min-width: 0;
    }

    .info-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .65px;
    }

    .info-value {
      display: block;
      color: #26372e;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .delivery-address {
      margin-top: 20px;
      padding: 14px 16px;
      background: #f7faf8;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .items-table-wrap {
      overflow-x: auto;
      width: 100%;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .items-table th {
      padding: 12px 10px;
      background: #f5f8f6;
      color: #68776e;
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 800;
      white-space: nowrap;
    }

    .items-table th:first-child {
      border-radius: 8px 0 0 8px;
    }

    .items-table th:last-child {
      border-radius: 0 8px 8px 0;
    }

    .items-table td {
      padding: 16px 10px;
      border-bottom: 1px solid var(--line);
      color: #3b4a41;
      vertical-align: middle;
    }

    .items-table .product-name {
      color: #1c2e23;
      font-weight: 750;
    }

    .items-table .product-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
    }

    .text-right {
      text-align: right !important;
      white-space: nowrap;
    }

    .totals-area {
      display: flex;
      justify-content: flex-end;
      padding-top: 22px;
    }

    .totals {
      width: min(100%, 340px);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 8px 0;
      color: #66756c;
      font-size: 12px;
    }

    .total-row strong {
      color: #293b30;
      font-weight: 750;
      white-space: nowrap;
    }

    .total-row.grand-total {
      margin-top: 10px;
      padding: 17px 0 0;
      border-top: 2px solid var(--green);
      color: var(--green-dark);
      font-size: 15px;
      font-weight: 850;
    }

    .total-row.grand-total strong {
      color: var(--green-dark);
      font-size: 22px;
      letter-spacing: -.6px;
    }

    .receipt-footer {
      padding: 30px 0 5px;
      text-align: center;
    }

    .thank-you-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      color: var(--green);
      background: var(--green-light);
      border-radius: 50%;
    }

    .receipt-footer h2 {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 19px;
      font-weight: 850;
    }

    .receipt-footer p {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .shop-contact-footer {
      margin-top: 17px;
      color: #849188;
      font-size: 10px;
      line-height: 1.8;
    }

    .receipt-bottom {
      padding: 13px 20px;
      background: #f7faf8;
      border-top: 1px dashed #dce6df;
      color: #849188;
      text-align: center;
      font-size: 10px;
    }

    .loading-state,
    .error-state {
      padding: 55px 25px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
    }

    .loading-state i,
    .error-state i {
      width: 35px;
      height: 35px;
    }

    .loading-state i {
      color: var(--green);
      animation: spin 1.4s linear infinite;
    }

    .loading-state p,
    .error-state p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .error-state h2 {
      margin: 15px 0 5px;
      color: var(--danger);
      font-size: 20px;
    }

    .error-state .btn {
      display: inline-flex;
      margin-top: 12px;
      text-decoration: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 650px) {
      .receipt-page {
        width: min(100% - 20px, 900px);
        padding: 18px 0 35px;
      }

      .receipt-inner {
        padding: 25px 19px;
      }

      .receipt-header {
        flex-direction: column;
        gap: 22px;
      }

      .receipt-heading {
        text-align: left;
      }

      .receipt-heading h1 {
        font-size: 22px;
      }

      .receipt-summary {
        align-items: flex-start;
      }

      .status-wrap {
        text-align: left;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
        gap: 17px 12px;
      }

      .items-table {
        min-width: 490px;
      }

      .receipt-toolbar {
        align-items: stretch;
      }

      .toolbar-left,
      .toolbar-right {
        width: 100%;
      }

      .toolbar-right .btn {
        flex: 1;
      }
    }

    @media (max-width: 380px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .receipt-inner {
        padding: 22px 15px;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      html,
      body {
        background: #fff !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .receipt-page {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .receipt-paper {
        overflow: visible;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .receipt-inner {
        padding: 15px 12px;
      }

      .receipt-top-accent {
        height: 5px;
      }

      .receipt-section,
      .receipt-header,
      .receipt-summary,
      .totals-area,
      .receipt-footer,
      .items-table tr {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .items-table-wrap {
        overflow: visible;
      }

      .items-table {
        min-width: 0;
      }

      .items-table th,
      .items-table td {
        padding: 9px 7px;
      }

      .receipt-bottom {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <header class="site-header no-print">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark">
          <i data-lucide="book-open"></i>
        </span>
        Mawego <span>Bookshop</span>
      </a>

      <nav class="nav">
        <a href="/">
          <i data-lucide="store"></i>
          Shop
        </a>
      </nav>
    </div>
  </header>

  <main class="receipt-page">

    <div class="receipt-toolbar no-print">
      <div class="toolbar-left">
        <a href="/" class="btn btn-outline">
          <i data-lucide="arrow-left"></i>
          Back to shop
        </a>
      </div>

      <div class="toolbar-right">
        <button type="button" class="btn btn-primary" id="printReceipt">
          <i data-lucide="printer"></i>
          Print / Save PDF
        </button>
      </div>
    </div>

    <div id="content" class="loading-state" aria-live="polite">
      <i data-lucide="loader-circle"></i>
      <p>Preparing your receipt...</p>
    </div>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/notifications.js"></script>

  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const orderNumber = params.get("order");
      const orderId = params.get("id");
      const phone = params.get("phone");

      const content = document.getElementById("content");
      const printButton = document.getElementById("printReceipt");

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function formatKes(value) {
        const amount = Number(value ?? 0);

        return "KES " + (Number.isFinite(amount) ? amount : 0)
          .toLocaleString("en-KE", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
      }

      function formatDate(value) {
        if (!value) return "Not available";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleString("en-KE", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      }

      function detail(label, value) {
        return `
          <div class="info-item">
            <span class="info-label">${escapeHtml(label)}</span>
            <span class="info-value">${escapeHtml(value || "Not provided")}</span>
          </div>
        `;
      }

      function getPaymentStatus(status) {
        const value = String(status || "pending").toLowerCase();

        const classes = {
          paid: "status-paid",
          pending: "status-pending",
          failed: "status-failed",
          refunded: "status-refunded"
        };

        return {
          className: classes[value] || "status-unknown",
          label: value.replace(/_/g, " ")
        };
      }

      function getItemName(item) {
        return item.product_name ||
          item.name ||
          item.title ||
          "Bookshop item";
      }

      function getQuantity(item) {
        const quantity = Number(item.quantity ?? item.qty ?? 1);
        return Number.isFinite(quantity) && quantity > 0 ? quantity : 1;
      }

      function getUnitPrice(item) {
        const candidates = [
          item.unit_price_kes,
          item.price_kes,
          item.unit_price,
          item.price
        ];

        for (const candidate of candidates) {
          if (candidate !== undefined && candidate !== null &&
              Number.isFinite(Number(candidate))) {
            return Number(candidate);
          }
        }

        const quantity = getQuantity(item);
        const lineTotal = Number(
          item.line_total_kes ?? item.total_kes ?? item.line_total
        );

        return Number.isFinite(lineTotal) ? lineTotal / quantity : 0;
      }

      function getLineTotal(item) {
        const candidates = [
          item.line_total_kes,
          item.total_kes,
          item.line_total
        ];

        for (const candidate of candidates) {
          if (candidate !== undefined && candidate !== null &&
              Number.isFinite(Number(candidate))) {
            return Number(candidate);
          }
        }

        return getUnitPrice(item) * getQuantity(item);
      }

      function renderItems(items) {
        if (!items.length) {
          return `
            <tr>
              <td colspan="4">No purchased items were returned.</td>
            </tr>
          `;
        }

        return items.map(item => {
          const quantity = getQuantity(item);
          const unitPrice = getUnitPrice(item);
          const lineTotal = getLineTotal(item);

          return `
            <tr>
              <td>
                <span class="product-name">${escapeHtml(getItemName(item))}</span>
              </td>
              <td class="text-right">${quantity}</td>
              <td class="text-right">${formatKes(unitPrice)}</td>
              <td class="text-right"><strong>${formatKes(lineTotal)}</strong></td>
            </tr>
          `;
        }).join("");
      }

      function renderReceipt(receipt) {
        if (!receipt || !receipt.order || !receipt.shop) {
          throw new Error("The receipt information is incomplete.");
        }

        const order = receipt.order;
        const shop = receipt.shop;
        const items = Array.isArray(order.items) ? order.items : [];
        const payment = getPaymentStatus(order.payment_status);

        const receiptNumber = receipt.receipt_number || order.order_number || "Receipt";
        const shopName = shop.name || "Mawego Bookshop";
        const paymentMethod = String(
          order.payment_method || "Not specified"
        ).replace(/_/g, " ");

        const fulfilment = String(
          order.fulfilment_type || "collection"
        ).replace(/_/g, " ");

        const subtotal = Number(order.subtotal_kes ?? 0);
        const deliveryFee = Number(order.delivery_fee_kes ?? 0);
        const total = Number(
          order.total_kes ?? subtotal + deliveryFee
        );

        document.title = `Receipt ${receiptNumber} | ${shopName}`;

        content.className = "";
        content.innerHTML = `
          <article class="receipt-paper">
            <div class="receipt-top-accent"></div>

            <div class="receipt-inner">

              <header class="receipt-header">
                <div class="brand">
                  <div class="brand-icon">
                    <i data-lucide="book-open"></i>
                  </div>

                  <div>
                    <p class="brand-name">${escapeHtml(shopName)}</p>
                    <div class="brand-tagline">
                      Quality Books. Knowledge. Excellence.
                    </div>
                  </div>
                </div>

                <div class="receipt-heading">
                  <h1>Payment Receipt</h1>
                  <p>Official purchase confirmation</p>
                </div>
              </header>

              <div class="receipt-summary">
                <div>
                  <div class="receipt-number-label">Receipt number</div>
                  <div class="receipt-number">${escapeHtml(receiptNumber)}</div>
                  <div class="receipt-date">
                    Issued ${escapeHtml(formatDate(order.created_at))}
                  </div>
                </div>

                <div class="status-wrap">
                  <div class="eyebrow">Payment status</div>
                  <div style="margin-top:9px">
                    <span class="status-pill ${payment.className}">
                      ${escapeHtml(payment.label)}
                    </span>
                  </div>
                </div>
              </div>

              <section class="receipt-section">
                <h2 class="section-title">
                  <i data-lucide="user-round"></i>
                  Customer information
                </h2>

                <div class="info-grid">
                  ${detail("Customer name", order.customer_name)}
                  ${detail("Phone number", order.customer_phone)}
                  ${detail("Order number", order.order_number)}
                  ${detail("Order date", formatDate(order.created_at))}
                  ${detail("Fulfilment method", fulfilment)}
                  ${detail("Customer email", order.customer_email)}
                </div>

                ${order.delivery_address ? `
                  <div class="delivery-address">
                    ${detail("Delivery address", order.delivery_address)}
                  </div>
                ` : ""}
              </section>

              <section class="receipt-section">
                <h2 class="section-title">
                  <i data-lucide="wallet"></i>
                  Payment information
                </h2>

                <div class="info-grid">
                  ${detail("Payment method", paymentMethod)}
                  ${detail("Payment status", payment.label)}
                  ${order.mpesa_receipt
                    ? detail("M-Pesa transaction", order.mpesa_receipt)
                    : ""}
                  ${order.payment_reference
                    ? detail("Payment reference", order.payment_reference)
                    : ""}
                </div>
              </section>

              <section class="receipt-section">
                <h2 class="section-title">
                  <i data-lucide="shopping-bag"></i>
                  Purchased items
                </h2>

                <div class="items-table-wrap">
                  <table class="items-table">
                    <thead>
                      <tr>
                        <th>Product</th>
                        <th class="text-right">Qty</th>
                        <th class="text-right">Unit price</th>
                        <th class="text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${renderItems(items)}
                    </tbody>
                  </table>
                </div>

                <div class="totals-area">
                  <div class="totals">
                    <div class="total-row">
                      <span>Subtotal</span>
                      <strong>${formatKes(subtotal)}</strong>
                    </div>

                    <div class="total-row">
                      <span>Delivery fee</span>
                      <strong>${deliveryFee > 0 ? formatKes(deliveryFee) : "FREE"}</strong>
                    </div>

                    ${Number(order.discount_kes || 0) > 0 ? `
                      <div class="total-row">
                        <span>Discount</span>
                        <strong>-${formatKes(order.discount_kes)}</strong>
                      </div>
                    ` : ""}

                    <div class="total-row grand-total">
                      <span>Total paid</span>
                      <strong>${formatKes(total)}</strong>
                    </div>
                  </div>
                </div>
              </section>

              <footer class="receipt-footer">
                <div class="thank-you-icon">
                  <i data-lucide="check-check"></i>
                </div>

                <h2>Thank you for shopping with us!</h2>

                <p>
                  ${escapeHtml(shop.footer ||
                    "Thank you for choosing Mawego Bookshop. We appreciate your business and look forward to serving you again.")}
                </p>

                <div class="shop-contact-footer">
                  ${escapeHtml(shop.address || "")}
                  ${shop.phone ? ` · ${escapeHtml(shop.phone)}` : ""}
                  ${shop.email ? ` · ${escapeHtml(shop.email)}` : ""}
                </div>
              </footer>

            </div>

            <div class="receipt-bottom">
              This is an official computer-generated receipt from ${escapeHtml(shopName)}.
              Please keep it for your records.
            </div>
          </article>
        `;

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      function showError(message) {
        content.className = "error-state";
        content.innerHTML = `
          <i data-lucide="receipt-text"></i>
          <h2>Unable to Load Receipt</h2>
          <p>${escapeHtml(message)}</p>
          <a href="/" class="btn btn-primary">Return to shop</a>
        `;

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      async function loadReceipt() {
        try {
             if (typeof API === "undefined") {
            throw new Error("The shop service is unavailable. Please refresh the page.");
          }

          let response;

          if (orderId) {
            response = await API.receiptByOrderId(orderId);
          } else if (orderNumber) {
            response = await API.receiptByNumber(orderNumber, phone);
          } else {
            throw new Error(
              "Missing order reference. Please open the receipt using your order link."
            );
          }

          if (!response || !response.receipt) {
            throw new Error("Receipt not found. Please check your order details.");
          }

          renderReceipt(response.receipt);

        } catch (error) {
          console.error("Receipt loading error:", error);
          showError(
            error && error.message
              ? error.message
              : "Something went wrong while loading your receipt."
          );
        }
      }

      printButton.addEventListener("click", () => {
        window.print();
      });

      if (window.lucide) {
        window.lucide.createIcons();
      }

      loadReceipt();
    })();
  </script>

</body>
</html>
