
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08734e">
  <meta name="description" content="Official Mawego Bookshop purchase receipt. View, print or save your order receipt.">

  <title>Purchase Receipt | Mawego Bookshop</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="/css/styles.css">

  <script src="https://unpkg.com/lucide@0.469.0"></script>

  <style>
    :root {
      --green: #08734e;
      --green-dark: #075b3d;
      --green-soft: #eaf6ef;
      --green-pale: #f5faf6;

      --ink: #17271f;
      --text: #34453b;
      --muted: #78877e;

      --line: #e5ece7;
      --surface: #ffffff;
      --background: #f3f7f4;

      --success: #16834a;
      --success-bg: #e9f8ef;

      --warning: #a15c00;
      --warning-bg: #fff5df;

      --danger: #b42318;
      --danger-bg: #fff0ee;

      --radius: 16px;
      --shadow: 0 18px 55px rgba(16, 55, 34, .07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .site-header {
      position: relative;
      z-index: 5;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      width: min(1100px, calc(100% - 36px));
      min-height: 68px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--green-dark);
      font-size: 18px;
      font-weight: 850;
      text-decoration: none;
      letter-spacing: -.5px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      border-radius: 11px;
    }

    .logo-mark svg {
      width: 21px;
      height: 21px;
    }

    .logo span:last-child {
      color: var(--green);
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .header-link:hover {
      color: var(--green);
    }

    .header-link svg {
      width: 17px;
      height: 17px;
    }

    .receipt-page {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 65px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 19px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 43px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font-size: 12px;
      font-weight: 750;
      text-decoration: none;
      transition: .2s ease;
    }

    .button:hover {
      border-color: #a9cdb7;
      background: var(--green-pale);
    }

    .button-primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    .button-primary:hover {
      border-color: var(--green-dark);
      background: var(--green-dark);
      color: white;
    }

    .button svg {
      width: 17px;
      height: 17px;
    }

    .receipt-paper {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid #e1eae4;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .receipt-accent {
      height: 6px;
      background: linear-gradient(90deg, #075b3d, #08734e, #36a66e);
    }

    .receipt-content {
      padding: 42px 46px;
    }

    /* RECEIPT HEADER */

    .receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 25px;
      padding-bottom: 29px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      border-radius: 14px;
    }

    .brand-icon svg {
      width: 27px;
      height: 27px;
    }

    .brand-name {
      margin: 0;
      color: var(--green-dark);
      font-size: 21px;
      font-weight: 850;
      letter-spacing: -.8px;
    }

    .brand-tagline {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .receipt-heading {
      text-align: right;
    }

    .receipt-heading h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .receipt-heading p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    /* ORDER SUMMARY */

    .order-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .receipt-number {
      margin-top: 7px;
      color: var(--green-dark);
      font-size: 21px;
      font-weight: 850;
      letter-spacing: -.5px;
      overflow-wrap: anywhere;
    }

    .receipt-date {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .payment-status-area {
      text-align: right;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .status-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      background: currentColor;
      border-radius: 50%;
    }

    .status-paid {
      color: var(--success);
      background: var(--success-bg);
    }

    .status-pending {
      color: var(--warning);
      background: var(--warning-bg);
    }

    .status-failed,
    .status-refunded {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .status-unknown {
      color: #65736a;
      background: #edf1ee;
    }

    /* SECTIONS */

    .receipt-section {
      padding: 27px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .section-title svg {
      width: 17px;
      height: 17px;
      color: var(--green);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 19px 30px;
    }

    .info-item {
      min-width: 0;
    }

    .info-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .75px;
      text-transform: uppercase;
    }

    .info-value {
      display: block;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .address-card {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding: 15px;
      background: #f7faf8;
      border: 1px solid var(--line);
      border-radius: 11px;
    }

    .address-card > svg {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      color: var(--green);
    }

    .address-card .info-label {
      margin-bottom: 5px;
    }

    /* ITEMS */

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .items-table th {
      padding: 12px 10px;
      background: #f4f8f5;
      color: #6d7b72;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .6px;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .items-table th:first-child {
      border-radius: 8px 0 0 8px;
    }

    .items-table th:last-child {
      border-radius: 0 8px 8px 0;
    }

    .items-table td {
      padding: 15px 10px;
      color: var(--text);
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    .product-name {
      display: block;
      color: #203329;
      font-weight: 750;
      line-height: 1.5;
    }

    .product-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .text-right {
      text-align: right !important;
      white-space: nowrap;
    }

    /* TOTALS */

    .totals-area {
      display: flex;
      justify-content: flex-end;
      padding-top: 22px;
    }

    .totals {
      width: min(100%, 340px);
    }

    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 0;
      color: #718078;
      font-size: 11px;
    }

    .total-row strong {
      color: #34453b;
      font-weight: 750;
      white-space: nowrap;
    }

    .total-row.discount strong {
      color: var(--success);
    }

    .total-row.grand-total {
      margin-top: 10px;
      padding-top: 16px;
      border-top: 2px solid var(--green);
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 850;
    }

    .total-row.grand-total strong {
      color: var(--green-dark);
      font-size: 22px;
      letter-spacing: -.7px;
    }

    /* FOOTER */

    .receipt-footer {
      padding: 31px 0 5px;
      text-align: center;
    }

    .thank-you-icon {
      width: 43px;
      height: 43px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      color: var(--green);
      background: var(--green-soft);
      border-radius: 50%;
    }

    .thank-you-icon svg {
      width: 21px;
      height: 21px;
    }

    .receipt-footer h2 {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 18px;
      font-weight: 850;
    }

    .receipt-footer p {
      max-width: 470px;
      margin: auto;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .shop-contact {
      margin-top: 16px;
      color: #8a978f;
      font-size: 10px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .receipt-bottom {
      padding: 13px 20px;
      background: #f7faf8;
      border-top: 1px dashed #dce6df;
      color: #89968e;
      text-align: center;
      font-size: 9px;
      line-height: 1.7;
    }

    /* LOADING AND ERRORS */

    .state-card {
      padding: 55px 24px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .state-icon {
      width: 38px;
      height: 38px;
      color: var(--green);
    }

    .loading-icon {
      animation: spin 1.3s linear infinite;
    }

    .state-card h2 {
      margin: 17px 0 7px;
      font-size: 20px;
    }

    .state-card p {
      max-width: 430px;
      margin: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .error-card h2 {
      color: var(--danger);
    }

    .state-actions {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* RESPONSIVE */

    @media (max-width: 650px) {
      .header-inner {
        min-height: 60px;
      }

      .receipt-page {
        width: calc(100% - 20px);
        padding: 19px 0 35px;
      }

      .receipt-content {
        padding: 25px 19px;
      }

      .receipt-header {
        flex-direction: column;
        gap: 22px;
      }

      .receipt-heading {
        text-align: left;
      }

      .receipt-heading h1 {
        font-size: 23px;
      }

      .payment-status-area {
        text-align: left;
      }

      .info-grid {
        gap: 17px 12px;
      }

      .items-table {
        min-width: 490px;
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar-group {
        width: 100%;
      }

      .toolbar-group .button {
        flex: 1;
      }
    }

    @media (max-width: 380px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .receipt-content {
        padding: 22px 15px;
      }

      .brand-name {
        font-size: 18px;
      }
    }

    /* PRINT */

    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      html,
      body {
        width: 100%;
        background: white !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .no-print,
      .site-header,
      .toolbar {
        display: none !important;
      }

      .receipt-page {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .receipt-paper {
        overflow: visible;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .receipt-content {
        padding: 15px 12px;
      }

      .receipt-accent {
        height: 5px;
      }

      .receipt-header,
      .order-summary,
      .receipt-section,
      .totals-area,
      .receipt-footer,
      .items-table tr {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .table-wrap {
        overflow: visible;
      }

      .items-table {
        min-width: 0;
      }

      .items-table th,
      .items-table td {
        padding: 9px 7px;
      }

      .receipt-bottom {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <header class="site-header no-print">
    <div class="header-inner">
      <a href="/" class="logo">
        <span class="logo-mark">
          <i data-lucide="book-open"></i>
        </span>
        Mawego <span>Bookshop</span>
      </a>

      <a href="/" class="header-link">
        <i data-lucide="store"></i>
        Continue shopping
      </a>
    </div>
  </header>

  <main class="receipt-page">

    <div class="toolbar no-print">
      <div class="toolbar-group">
        <a href="/" class="button">
          <i data-lucide="arrow-left"></i>
          Back to shop
        </a>
      </div>

      <div class="toolbar-group">
        <button type="button" class="button button-primary" id="printReceipt">
          <i data-lucide="printer"></i>
          Print / Save PDF
        </button>
      </div>
    </div>

    <div id="content" class="state-card" aria-live="polite">
      <i data-lucide="loader-circle" class="state-icon loading-icon"></i>
      <p>Loading your purchase receipt. Please wait...</p>
    </div>

  </main>

  <script src="/js/api.js"></script>

  <script>
    (() => {
      "use strict";

      const content = document.getElementById("content");
      const printButton = document.getElementById("printReceipt");

      const params = new URLSearchParams(window.location.search);

      const orderId = params.get("id");
      const orderNumber = params.get("order");
      const phone = params.get("phone");

      const $ = (selector, root = document) =>
        root.querySelector(selector);

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function number(value, fallback = 0) {
        const result = Number(value);
        return Number.isFinite(result) ? result : fallback;
      }

      function money(value) {
        return "KES " + number(value).toLocaleString("en-KE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function formatDate(value) {
        if (!value) return "Not available";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleString("en-KE", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      }

      function cleanLabel(value) {
        return String(value || "Not specified")
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/\b\w/g, letter => letter.toUpperCase());
      }

      function detail(label, value) {
        return `
          <div class="info-item">
            <span class="info-label">${escapeHtml(label)}</span>
            <span class="info-value">${escapeHtml(value || "Not provided")}</span>
          </div>
        `;
      }

      function statusDetails(status) {
        const value = String(status || "pending").toLowerCase();

        const classes = {
          paid: "status-paid",
          pending: "status-pending",
          failed: "status-failed",
          refunded: "status-refunded"
        };

        return {
          className: classes[value] || "status-unknown",
          label: cleanLabel(value)
        };
      }

      function getItemName(item) {
        return item.product_name ||
          item.name ||
          item.title ||
          "Bookshop item";
      }

      function getQuantity(item) {
        const qty = number(item.quantity ?? item.qty, 1);
        return qty > 0 ? qty : 1;
      }

      function getUnitPrice(item) {
        const candidates = [
          item.unit_price_kes,
          item.price_kes,
          item.unit_price,
          item.price
        ];

        for (const candidate of candidates) {
          if (
            candidate !== undefined &&
            candidate !== null &&
            Number.isFinite(Number(candidate))
          ) {
            return Number(candidate);
          }
        }

        return getLineTotal(item) / getQuantity(item);
      }

      function getLineTotal(item) {
        const candidates = [
          item.line_total_kes,
          item.total_kes,
          item.line_total
        ];

        for (const candidate of candidates) {
          if (
            candidate !== undefined &&
            candidate !== null &&
            Number.isFinite(Number(candidate))
          ) {
            return Number(candidate);
          }
        }

        return number(getUnitPriceFallback(item)) * getQuantity(item);
      }

      function getUnitPriceFallback(item) {
        return item.unit_price_kes ??
          item.price_kes ??
          item.unit_price ??
          item.price ??
          0;
      }

      function renderItems(items) {
        if (!items.length) {
          return `
            <tr>
              <td colspan="4">No order items were returned.</td>
            </tr>
          `;
        }

        return items.map(item => {
          const qty = getQuantity(item);
          const unitPrice = getUnitPrice(item);
          const lineTotal = getLineTotal(item);

          return `
            <tr>
              <td>
                <span class="product-name">
                  ${escapeHtml(getItemName(item))}
                </span>
              </td>

              <td class="text-right">${qty}</td>

              <td class="text-right">${money(unitPrice)}</td>

              <td class="text-right">
                <strong>${money(lineTotal)}</strong>
              </td>
            </tr>
          `;
        }).join("");
      }

      function renderReceipt(receipt) {
        if (!receipt || !receipt.order) {
          throw new Error("The receipt information is incomplete.");
        }

        const order = receipt.order;
        const shop = receipt.shop || {};

        const items = Array.isArray(order.items)
          ? order.items
          : [];

        const payment = statusDetails(order.payment_status);

        const shopName = shop.name || "Mawego Bookshop";

        const receiptNumber =
          receipt.receipt_number ||
          order.order_number ||
          "Purchase Receipt";

        const subtotal = number(
          order.subtotal_kes,
          items.reduce((sum, item) => sum + getLineTotal(item), 0)
        );

        const deliveryFee = number(
          order.delivery_fee_kes ?? order.delivery_fee
        );

        const discount = number(
          order.discount_kes ??
          order.coupon_discount_kes
        );

        const pointsDiscount = number(
          order.points_discount_kes
        );

        const total = number(
          order.total_kes,
          subtotal + deliveryFee - discount - pointsDiscount
        );

        const paymentMethod = cleanLabel(order.payment_method);
        const fulfilment = cleanLabel(order.fulfilment_type);

        document.title = `Receipt ${receiptNumber} | ${shopName}`;

        content.className = "";
        content.innerHTML = `
          <article class="receipt-paper">

            <div class="receipt-accent"></div>

            <div class="receipt-content">

              <header class="receipt-header">

                <div class="brand">
                  <div class="brand-icon">
                    <i data-lucide="book-open"></i>
                  </div>

                  <div>
                    <h2 class="brand-name">
                      ${escapeHtml(shopName)}
                    </h2>

                    <div class="brand-tagline">
                      Books, Learning & Knowledge
                    </div>
                  </div>
                </div>

                <div class="receipt-heading">
                  <h1>Purchase Receipt</h1>
                  <p>Official order transaction record</p>
                </div>

              </header>

              <section class="order-summary">

                <div>
                  <div class="eyebrow">Receipt number</div>

                  <div class="receipt-number">
                    ${escapeHtml(receiptNumber)}
                  </div>

                  <div class="receipt-date">
                    Issued ${escapeHtml(formatDate(order.created_at))}
                  </div>
                </div>

                <div class="payment-status-area">
                  <div class="eyebrow">Payment status</div>

                  <div style="margin-top:9px">
                    <span class="status-pill ${payment.className}">
                      ${escapeHtml(payment.label)}
                    </span>
                  </div>
                </div>

              </section>

              <section class="receipt-section">

                <h3 class="section-title">
                  <i data-lucide="user-round"></i>
                  Customer information
                </h3>

                <div class="info-grid">

                  ${detail("Customer name", order.customer_name)}

                  ${detail("Phone number", order.customer_phone)}

                  ${detail("Email address", order.customer_email)}

                  ${detail("Order number", order.order_number)}

                  ${detail("Order date", formatDate(order.created_at))}

                  ${detail("Fulfilment method", fulfilment)}

                </div>

                ${order.delivery_address ? `
                  <div class="address-card">
                    <i data-lucide="map-pin"></i>

                    <div>
                      <span class="info-label">Delivery address</span>

                      <span class="info-value">
                        ${escapeHtml(order.delivery_address)}
                      </span>
                    </div>
                  </div>
                ` : ""}

              </section>

              <section class="receipt-section">

                <h3 class="section-title">
                  <i data-lucide="wallet"></i>
                  Payment information
                </h3>

                <div class="info-grid">

                  ${detail("Payment method", paymentMethod)}

                  ${detail("Payment status", payment.label)}

                  ${order.mpesa_receipt
                    ? detail("M-Pesa receipt", order.mpesa_receipt)
                    : ""}

                  ${order.payment_reference
                    ? detail("Payment reference", order.payment_reference)
                    : ""}

                  ${order.order_status
                    ? detail("Order status", cleanLabel(order.order_status))
                    : ""}

                </div>

              </section>

              <section class="receipt-section">

                <h3 class="section-title">
                  <i data-lucide="shopping-bag"></i>
                  Order items
                </h3>

                <div class="table-wrap">

                  <table class="items-table">

                    <thead>
                      <tr>
                        <th>Product description</th>
                        <th class="text-right">Quantity</th>
                        <th class="text-right">Unit price</th>
                        <th class="text-right">Amount</th>
                      </tr>
                    </thead>

                    <tbody>
                      ${renderItems(items)}
                    </tbody>

                  </table>

                </div>

                <div class="totals-area">

                  <div class="totals">

                    <div class="total-row">
                      <span>Subtotal</span>
                      <strong>${money(subtotal)}</strong>
                    </div>

                    <div class="total-row">
                      <span>Delivery fee</span>
                      <strong>
                        ${deliveryFee > 0 ? money(deliveryFee) : "FREE"}
                      </strong>
                    </div>

                    ${discount > 0 ? `
                      <div class="total-row discount">
                        <span>Discount</span>
                        <strong>-${money(discount)}</strong>
                      </div>
                    ` : ""}

                    ${pointsDiscount > 0 ? `
                      <div class="total-row discount">
                        <span>Loyalty points discount</span>
                        <strong>-${money(pointsDiscount)}</strong>
                      </div>
                    ` : ""}

                    ${order.coupon_code ? `
                      <div class="total-row">
                        <span>Coupon applied</span>
                        <strong>${escapeHtml(order.coupon_code)}</strong>
                      </div>
                    ` : ""}

                    <div class="total-row grand-total">
                      <span>Total amount</span>
                      <strong>${money(total)}</strong>
                    </div>

                  </div>

                </div>

              </section>

              <footer class="receipt-footer">

                <div class="thank-you-icon">
                  <i data-lucide="check-check"></i>
                </div>

                <h2>Thank you for shopping with us!</h2>

                <p>
                  ${escapeHtml(
                    shop.footer ||
                    "We appreciate your trust in Mawego Bookshop. Thank you for supporting our business. We look forward to serving you again."
                  )}
                </p>

                <div class="shop-contact">

                  ${escapeHtml(shop.address || "")}

                  ${shop.phone
                    ? ` · ${escapeHtml(shop.phone)}`
                    : ""}

                  ${shop.email
                    ? ` · ${escapeHtml(shop.email)}`
                    : ""}

                </div>

              </footer>

            </div>

            <div class="receipt-bottom">
              This is an official computer-generated receipt from
              ${escapeHtml(shopName)}. Please keep it for your records.
            </div>

          </article>
        `;

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      function showError(message) {
        content.className = "state-card error-card";

        content.innerHTML = `
          <i data-lucide="receipt-text" class="state-icon"></i>

          <h2>Unable to Load Receipt</h2>

          <p>${escapeHtml(message)}</p>

          <div class="state-actions">
            <a href="/" class="button button-primary">
              <i data-lucide="house"></i>
              Return to shop
            </a>

            <button type="button" class="button" id="retryReceipt">
              <i data-lucide="refresh-cw"></i>
              Try again
            </button>
          </div>
        `;

        if (window.lucide) {
          window.lucide.createIcons();
        }

        $("#retryReceipt")?.addEventListener("click", loadReceipt);
      }

      async function loadReceipt() {
        content.className = "state-card";

        content.innerHTML = `
          <i data-lucide="loader-circle" class="state-icon loading-icon"></i>
          <p>Loading your purchase receipt. Please wait...</p>
        `;

        if (window.lucide) {
          window.lucide.createIcons();
        }

        try {
          if (!window.API) {
            throw new Error(
              "The shop service is unavailable. Please refresh the page."
            );
          }

          let response;

          if (orderId) {
            if (typeof API.receiptByOrderId !== "function") {
              throw new Error(
                "The order ID receipt service is not configured in api.js."
              );
            }

            response = await API.receiptByOrderId(orderId);

          } else if (orderNumber) {
            if (typeof API.receiptByNumber !== "function") {
              throw new Error(
                "The order number receipt service is not configured in api.js."
              );
            }

            response = await API.receiptByNumber(orderNumber, phone);

          } else {
            throw new Error(
              "Missing order reference. Open your receipt using the order link."
            );
          }

          if (!response || !response.receipt) {
            throw new Error(
              response?.message || "Receipt not found. Please check your order details."
            );
          }

          renderReceipt(response.receipt);

        } catch (error) {
          console.error("Mawego receipt error:", error);

          showError(
            error?.message ||
            "Something went wrong while loading your receipt."
          );
        }
      }

      printButton.addEventListener("click", () => {
        window.print();
      });

      if (window.lucide) {
        window.lucide.createIcons();
      }

      loadReceipt();

    })();
  </script>

</body>
</html>
