        <div class="card-head"><h2>Promotions to watch</h2><a class="btn btn-sm" href="${M('promos')}">View all</a></div>

    </div>

      ${hbars((MK.sales.top_products || []).slice(0, 5).map((r) => ({ label: r.product_name, value: num(r.revenue), display: kes(r.revenue), sub: `${r.qty_sold} sold` })))}</div>` : ''}`;

  arrivals: `<h2>New arrivals at Mawego Bookshop 📚</h2>\n<p>Hello,</p>\n<p>Fresh titles have just landed on our shelves. Come and see what's new this week.</p>\n<p>— Mawego Bookshop</p>`,

function openCampaignForm(prefill = {}) {
  const act = activePromos();
  openModal(`
    <h2>New newsletter campaign</h2>
    <form id="nl-form">
      <div class="form-group"><label>Subject * <span class="hint" id="nl-count"></span></label>
        <input name="subject" required value="${esc(prefill.subject || '')}" placeholder="e.g. New arrivals this week"></div>
      <div class="form-group"><label>Preview text</label>
        <input name="preview_text" value="${esc(prefill.preview_text || '')}" placeholder="Shown next to the subject in the inbox"></div>
      <div class="tpl-row">
        <span class="hint">Templates:</span>
        <button type="button" class="btn btn-sm" data-tpl="arrivals">New arrivals</button>
        <button type="button" class="btn btn-sm" data-tpl="event">Event invite</button>
        <button type="button" class="btn btn-sm" data-tpl="backtoschool">Back to school</button>
        ${act.length ? `<select id="nl-coupon"><option value="">Insert coupon…</option>${act.map((p) => `<option value="${esc(p.id)}">${esc(p.code)} — ${esc(promoValue(p))}</option>`).join('')}</select>` : ''}
      </div>
      <div class="form-group"><label>Email body * (HTML allowed)</label>
        <textarea name="html_content" rows="9" required placeholder="Write your email content here…">${esc(prefill.html_content || '')}</textarea></div>
      <div class="form-group"><label>Live preview</label><iframe class="preview-frame" id="nl-frame" sandbox style="height:260px"></iframe></div>
      <label class="check"><input type="checkbox" name="send_now"> Send immediately to ${subCount().toLocaleString()} active subscribers</label>
      <div class="modal-actions">
        <button type="button" class="btn" id="nl-close">Cancel</button>
        <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Create campaign</button>
      </div>
    </form>`, 'wide');

  const f = $('#nl-form'), ta = f.elements.html_content, sub = f.elements.subject;
  const refresh = () => { $('#nl-frame').srcdoc = ta.value; $('#nl-count').textContent = `${sub.value.length}/60 chars`; };
  ta.oninput = refresh; sub.oninput = refresh; refresh();
  $$('[data-tpl]', f).forEach((b) => { b.onclick = () => { ta.value = TEMPLATES[b.dataset.tpl]; refresh(); }; });
  const cp = $('#nl-coupon', f);
  if (cp) cp.onchange = () => {
    const p = act.find((x) => String(x.id) === cp.value);
    if (p) { ta.value = (ta.value ? ta.value + '\n' : '') + couponBlock(p); refresh(); }
    cp.value = '';
  };
  $('#nl-close').onclick = closeModal;
  f.onsubmit = (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', f); btn.disabled = true;
    guarded(async () => {
      const fd = new FormData(f);
      const created = await API.adminCreateCampaign({
        subject: String(fd.get('subject')).trim(),
        preview_text: String(fd.get('preview_text') || '').trim(),
        html_content: String(fd.get('html_content')).trim()
      });
      if (fd.get('send_now')) {
        const id = created?.id ?? created?.campaign?.id ?? created?.campaign_id;
        if (id == null) toast('Campaign created, but could not be sent automatically. Send it from the list.', 'error');
        else { await API.adminSendCampaign(id); toast('Campaign created and is being sent'); }
      } else toast('Campaign created');
      closeModal();
      if (parseHash().params.tab === 'campaigns') route(); else go('marketing', { tab: 'campaigns' });
    }).then(() => { btn.disabled = false; });
  };
}

async function sendCampaignNow(c) {
  const ok = await confirmDialog('Send campaign now?',
    `“${c.subject}” will be sent to ${subCount().toLocaleString()} active subscribers via Brevo. This cannot be undone.`, 'Send now');
  if (!ok) return;
  guarded(async () => { await API.adminSendCampaign(c.id); closeModal(); toast('Campaign is being sent'); route(); });
}

  dashboard: renderDashboard, orders: renderOrders, products: renderProducts, customers: renderCustomers,
  marketing: renderMarketing, promotions: renderPromotions, inventory: renderInventory,
  suppliers: renderSuppliers, expenses: renderExpenses, sales: renderSales, pnl: renderPnL, staff: renderStaff
};

function openPalette() {
  const base = [
    ...NAV.filter((n) => can(n.id)).map((n) => ({ t: `Go to ${n.label}`, icon: n.icon, run: () => go(n.id) })),
    ...(can('marketing') ? [
      { t: 'Marketing › Subscribers', icon: 'users', run: () => go('marketing', { tab: 'subscribers' }) },
      { t: 'Marketing › Campaigns', icon: 'mail', run: () => go('marketing', { tab: 'campaigns' }) },
      { t: 'Marketing › Active promotions', icon: 'ticket-percent', run: () => go('marketing', { tab: 'promos', filter: 'active' }) },
      { t: 'New newsletter campaign', icon: 'mail-plus', run: () => guarded(async () => { await mktData(); openCampaignForm(); }) }
    ] : []),
    { t: 'Add product', icon: 'plus', run: () => guarded(async () => openProductForm(null, (await API.categories()).categories)) },
    ...(can('promotions') ? [{ t: 'New coupon', icon: 'ticket-percent', run: () => openCouponForm(null) }] : []),
    { t: 'Record expense', icon: 'receipt', run: openExpenseModal },
    { t: 'New purchase order', icon: 'truck', run: () => openPOModal() },
    ...(can('orders') ? [{ t: 'Pending orders', icon: 'clock', run: () => go('orders', { status: 'pending' }) }] : []),
    { t: 'Low stock items', icon: 'alert-triangle', run: () => go('inventory', { state: 'alerts' }) },
    { t: 'Keyboard shortcuts', icon: 'keyboard', run: openHelp },
    { t: 'Toggle dark mode', icon: 'moon', run: toggleTheme },
    { t: 'Toggle compact tables', icon: 'rows-3', run: toggleDensity }
  ];
  openModal('<input id="pal-q" placeholder="Type a command, or search products and orders…" autocomplete="off"><ul id="pal-list"></ul>', 'palette');
  let sel = 0, items = base;
  const draw = () => {
    $('#pal-list').innerHTML = items.map((i, n) =>
      `<li class="${n === sel ? 'sel' : ''}" data-n="${n}"><i data-lucide="${i.icon}"></i>${esc(i.t)}${i.hint ? `<span class="hint">${esc(i.hint)}</span>` : ''}</li>`).join('') || '<li class="muted">No matches</li>';
    icons($('#pal-list'));
    $('.sel', $('#pal-list'))?.scrollIntoView({ block: 'nearest' });
  };
  const run = (i) => { closeModal(); if (i) i.run(); };
  $('#pal-q').oninput = (e) => {
    const raw = e.target.value.trim(), q = raw.toLowerCase();
    items = base.filter((i) => i.t.toLowerCase().includes(q));
    if (q) {
      if (can('products')) items.push({ t: `Search products for “${raw}”`, icon: 'book-open', hint: 'Products', run: () => go('products', { q: raw }) });
      if (can('orders')) items.push({ t: `Search orders for “${raw}”`, icon: 'shopping-cart', hint: 'Orders', run: () => go('orders', { q: raw }) });
      if (can('customers')) items.push({ t: `Search customers for “${raw}”`, icon: 'contact', hint: 'Customers', run: () => go('customers', { q: raw }) });
    }
    sel = 0; draw();
  };
  $('#pal-q').onkeydown = (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') run(items[sel]);
  };
  $('#pal-list').onclick = (e) => { const li = e.target.closest('li[data-n]'); if (li) run(items[Number(li.dataset.n)]); };
  draw();
}

function openHelp() {
  const rows = [['Ctrl / ⌘ + K', 'Command palette'], ['/', 'Focus search'], ['R', 'Refresh view'], ['?', 'This help'], ['Esc', 'Close dialog'],
    ...NAV.filter((n) => can(n.id)).map((n) => [`G then ${n.key.toUpperCase()}`, `Go to ${n.label}`])];
  openModal(`<h2>Keyboard shortcuts</h2><div class="sc-grid">${rows.map(([k, v]) => `<kbd style="margin:0">${esc(k)}</kbd><span>${esc(v)}</span>`).join('')}</div>
    <div class="modal-actions"><button class="btn btn-primary" id="hp-close">Close</button></div>`);
  $('#hp-close').onclick = closeModal;
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#theme-btn');
  if (b) { b.innerHTML = `<i data-lucide="${t === 'dark' ? 'sun' : 'moon'}"></i>`; icons(b); }
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('admin-theme', t); applyTheme(t);
}
function toggleDensity() {
  const on = document.body.classList.toggle('compact');
  store.set('admin-density', on ? 'compact' : 'comfortable');
}

applyTheme(store.get('admin-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
if (store.get('admin-density') === 'compact') document.body.classList.add('compact');

$('#theme-btn').onclick = toggleTheme;
$('#density-btn').onclick = toggleDensity;
$('#help-btn').onclick = openHelp;
$('#menu-btn').onclick = () => $('#sidebar').classList.toggle('open');
$('#palette-btn').onclick = () => { if (isStaffUser(API.getUser())) openPalette(); };
$('#refresh-btn').onclick = () => { route(); toast('Refreshed'); };

const syncOnline = () => $('#offline-bar').classList.toggle('hidden', navigator.onLine);
window.addEventListener('online', () => { syncOnline(); toast('Back online'); });
window.addEventListener('offline', syncOnline);
syncOnline();

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (isStaffUser(API.getUser())) openPalette();
    return;
  }
  if (e.key === 'Escape' && modalOpen()) return closeModal();
  if (/input|textarea|select/i.test(e.target.tagName) || modalOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!isStaffUser(API.getUser())) return;

  if (e.key === 'r') route();
  if (e.key === '?') openHelp();
  if (e.key === '/') {
    e.preventDefault();
    const s = $('input[type=search]');
    if (s) s.focus(); else openPalette();
  }
  if (e.key === 'g') {
    const handler = (ev) => {
      const n = NAV.find((x) => x.key === ev.key.toLowerCase());
      if (n && can(n.id)) go(n.id);
      document.removeEventListener('keydown', handler, true);
    };
    document.addEventListener('keydown', handler, true);
    setTimeout(() => document.removeEventListener('keydown', handler, true), 1500);
  }
});

/* =====================================================================
   16. BOOT
   ===================================================================== */
icons();
if (isStaffUser(API.getUser())) showApp(); else showLogin();
})();
</script>
</body>
</html>
