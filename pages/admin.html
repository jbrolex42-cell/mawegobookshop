<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Mawego Bookshop</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<script src="https://unpkg.com/lucide@0.469.0"></script>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--text:#1b1f27;--muted:#6b7280;--border:#e3e6eb;--brand:#1f7a4d;--brand-2:#155c3a;--brand-soft:#e3f4ea;--danger:#c0392b;--danger-soft:#fde8e6;--warn:#b7791f;--warn-soft:#fff3d6;--info:#2b6cb0;--info-soft:#e6f0fb;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--shadow-lg:0 12px 32px rgba(16,24,40,.18);--radius:12px;--sidebar:236px;--cell-y:.65rem;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
:root[data-theme="dark"]{--bg:#0f1318;--surface:#171c23;--surface-2:#1f262f;--text:#e8ebf0;--muted:#8b95a5;--border:#2a323d;--brand:#3ca873;--brand-2:#2f8c5f;--brand-soft:#16352a;--danger:#e5675a;--danger-soft:#3a1d1a;--warn:#e0b04a;--warn-soft:#3a2f12;--info:#6ea8e8;--info-soft:#17283d;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.6)}
body.compact{--cell-y:.3rem}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0}h1{font-size:1.45rem}h2{font-size:1.05rem}a{color:inherit;text-decoration:none}
.hidden{display:none!important}.muted{color:var(--muted)}.hint{font-size:.78rem;color:var(--muted)}.right{text-align:right}.nowrap{white-space:nowrap}
i[data-lucide],svg.lucide{width:16px;height:16px;vertical-align:-3px;flex:none}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--surface-2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-2)}
.btn-danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-soft{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.btn-sm{padding:.3rem .6rem;font-size:.8rem;border-radius:8px}.btn-icon{padding:.45rem}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.5rem .65rem;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:auto}
label{font-size:.8rem;font-weight:600;color:var(--muted);display:block;margin-bottom:.25rem}
.form-group{margin-bottom:.85rem}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.check{display:flex;align-items:center;gap:.5rem;color:var(--text);font-size:.9rem}
details{margin-bottom:.85rem}summary{cursor:pointer;font-weight:600;margin-bottom:.6rem}
.img-preview{max-width:90px;max-height:120px;margin-top:.5rem;border-radius:6px;display:block}
#login-view{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(135deg,var(--brand-soft),var(--bg))}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;padding:2rem;box-shadow:var(--shadow-lg)}
.login-card .mark{width:48px;height:48px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-bottom:1rem}
.alert{padding:.65rem .85rem;border-radius:9px;margin-bottom:.85rem;font-size:.88rem}.alert-error{background:var(--danger-soft);color:var(--danger)}.alert-warn{background:var(--warn-soft);color:var(--warn)}
.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1rem .75rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:.15rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.05rem;padding:.4rem .6rem 1rem}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center}
.nav-link{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;border-radius:9px;color:var(--muted);font-weight:600}
.nav-link:hover{background:var(--surface-2);color:var(--text)}.nav-link.active{background:var(--brand-soft);color:var(--brand)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:.68rem;padding:.05rem .45rem;border-radius:99px}
.side-foot{margin-top:auto;padding:.75rem .6rem 0;border-top:1px solid var(--border);font-size:.8rem}
.main{min-width:0}
.topbar{display:flex;align-items:center;gap:.75rem;padding:.8rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar .spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:.6rem;min-width:260px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:.45rem .7rem;cursor:pointer;font:inherit}
kbd{font-family:inherit;font-size:.7rem;border:1px solid var(--border);background:var(--surface);border-radius:5px;padding:.05rem .35rem;margin-left:auto}
.menu-btn{display:none}.content{padding:1.5rem;max-width:1400px}
.offline{background:var(--warn-soft);color:var(--warn);text-align:center;padding:.4rem;font-weight:600;font-size:.82rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.page-head p{margin:.2rem 0 0;color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;gap:.5rem}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem;margin-bottom:1.25rem}
.stat{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);position:relative;transition:.15s}
a.stat{cursor:pointer}a.stat:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--shadow-lg)}
.stat .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:.6rem}
.stat.warn .ico{background:var(--warn-soft);color:var(--warn)}.stat.bad .ico{background:var(--danger-soft);color:var(--danger)}.stat.info .ico{background:var(--info-soft);color:var(--info)}
.stat .label{font-size:.78rem;color:var(--muted);font-weight:600}.stat .value{font-size:1.4rem;font-weight:800;margin:.1rem 0}.stat .sub{font-size:.78rem;color:var(--muted)}
.stat .go{position:absolute;top:.9rem;right:.9rem;color:var(--muted);opacity:0;transition:.15s}.stat:hover .go{opacity:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.1rem}
.cols-3{display:grid;grid-template-columns:2fr 1fr;gap:1.1rem}
.quick{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:.65rem .85rem;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--text)}
td{padding:var(--cell-y) .85rem;border-bottom:1px solid var(--border);vertical-align:middle}
td.sel,th.sel{width:34px;padding-right:0}
tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr:hover{background:var(--surface-2)}tr.dim td{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:2rem!important}
.pager{display:flex;justify-content:space-between;align-items:center;padding:.6rem .85rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.row-actions{display:flex;gap:.3rem;justify-content:flex-end;flex-wrap:wrap}
.thumb{width:34px;height:46px;object-fit:cover;border-radius:4px;background:var(--surface-2);display:block}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.9rem}
.toolbar input[type=search]{max-width:340px;flex:1;min-width:180px}.toolbar select,.toolbar input[type=date]{width:auto}
.bulkbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;background:var(--brand-soft);color:var(--brand);padding:.5rem .8rem;border-radius:10px;margin-bottom:.9rem;font-weight:600}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.9rem}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:.25rem .75rem;font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip b{opacity:.8;margin-left:.25rem}
.pill,.badge{display:inline-block;padding:.12rem .6rem;border-radius:99px;font-size:.74rem;font-weight:700;text-transform:capitalize;white-space:nowrap}
.t-ok,.t-paid,.t-completed,.t-received,.t-published,.t-active,.t-sent,.t-subscribed{background:var(--brand-soft);color:var(--brand)}
.t-low,.t-pending,.t-ordered,.t-unpaid,.t-draft,.t-scheduled,.t-used_up{background:var(--warn-soft);color:var(--warn)}
.t-out,.t-cancelled,.t-failed,.t-expired,.t-unsubscribed,.t-blacklisted,.t-bounced{background:var(--danger-soft);color:var(--danger)}
.t-confirmed,.t-processing,.t-ready,.t-out_for_delivery,.t-upcoming,.t-queued,.t-in_process{background:var(--info-soft);color:var(--info)}
.t-archived,.t-default,.t-inactive{background:var(--surface-2);color:var(--muted)}
.bars .bar{margin:.55rem 0}.bar .top{display:flex;justify-content:space-between;font-size:.85rem;gap:.5rem}
.bar .track{height:8px;background:var(--surface-2);border-radius:99px;margin-top:.25rem;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:99px}
.donut-wrap{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.85rem}
.legend i.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.trend{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:.5rem}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.trend .b{width:100%;background:var(--brand);border-radius:5px 5px 0 0;min-height:2px;opacity:.85}.trend .col:hover .b{opacity:1}
.trend .d{font-size:.65rem;color:var(--muted);margin-top:.25rem}
.delta{font-size:.75rem;font-weight:700}
.pnl-line{display:flex;justify-content:space-between;padding:.5rem 0}.pnl-line.sub{border-top:1px solid var(--border)}
.pnl-line.total{border-top:2px solid var(--brand);margin-top:.4rem;padding-top:.8rem;font-size:1.15rem}
.neg{color:var(--danger)}.pos{color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:start center;padding:6vh 1rem;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:600px;padding:1.4rem;animation:pop .18s}
.modal.wide{max-width:780px}.modal h2{margin-bottom:.9rem;font-size:1.2rem}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.1rem}
.kv{display:grid;grid-template-columns:130px 1fr;gap:.35rem .75rem;margin-bottom:1rem;font-size:.9rem}.kv dt{color:var(--muted)}.kv dd{margin:0}
.stepper{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.step{flex:1;min-width:70px;text-align:center;padding:.35rem .4rem;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:.72rem;font-weight:700;text-transform:capitalize;cursor:pointer}
.step.done{background:var(--brand-soft);color:var(--brand)}.step.cur{background:var(--brand);color:#fff}.step.cancel.cur{background:var(--danger)}
#toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:.7rem 1rem;border-radius:10px;box-shadow:var(--shadow-lg);display:flex;gap:.6rem;align-items:center;max-width:360px;animation:pop .2s}
.toast.error{background:var(--danger);color:#fff}
.palette{max-width:560px;padding:0;overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:1rem 1.2rem;font-size:1rem}.palette input:focus{outline:none}
.palette ul{list-style:none;margin:0;padding:.4rem;max-height:340px;overflow:auto}
.palette li{display:flex;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:8px;cursor:pointer}
.palette li .hint{margin-left:auto}.palette li.sel{background:var(--brand-soft);color:var(--brand)}
.loading{display:grid;place-items:center;padding:4rem;color:var(--muted)}.spin{animation:spin 1s linear infinite}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}@keyframes spin{to{transform:rotate(360deg)}}
.mkt-tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.1rem;border-bottom:1px solid var(--border);padding-bottom:.6rem}
.mkt-tab{padding:.45rem .9rem;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid transparent;background:transparent;font:inherit}
.mkt-tab:hover{background:var(--surface-2);color:var(--text)}.mkt-tab.on{background:var(--brand-soft);color:var(--brand)}
.mkt-tab b{margin-left:.35rem;font-size:.72rem;background:var(--surface-2);border-radius:99px;padding:.02rem .45rem;color:var(--muted)}
.mkt-tab.on b{background:var(--surface);color:var(--brand)}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.mini-list li:last-child{border-bottom:0}.mini-list li:hover b{color:var(--brand)}
.usage{display:flex;align-items:center;gap:.5rem;min-width:120px}
.usage .track{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}.usage .fill{height:100%;background:var(--brand)}
.preview-frame{width:100%;height:380px;border:1px solid var(--border);border-radius:10px;background:#fff}
.tpl-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}.tpl-row select{width:auto}
.sc-grid{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;font-size:.9rem}
@media(max-width:900px){
.shell{grid-template-columns:1fr}
.sidebar{position:fixed;left:0;top:0;z-index:60;width:250px;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow-lg)}
.sidebar.open{transform:none}.menu-btn{display:inline-flex}.cols,.cols-3{grid-template-columns:1fr}
.search-trigger{min-width:0;flex:1}.search-trigger span,.search-trigger kbd{display:none}
.content{padding:1rem}.form-row{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.actions,.toolbar,.quick,.chips,.bulkbar,#toasts{display:none!important}.shell{display:block}.card,.table-wrap{box-shadow:none}}
</style>
</head>
<body>

<main id="login-view">
  <div class="login-card">
    <div class="mark"><i data-lucide="book-open"></i></div>
    <h1>Staff login</h1>
    <p class="muted" style="margin:.25rem 0 1.25rem">Mawego Bookshop admin</p>
    <div id="login-msg"></div>
    <form id="login-form">
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" required autocomplete="username" /></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" /></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center"><i data-lucide="log-in"></i> Sign in</button>
    </form>
    <p style="text-align:center;margin:1rem 0 0"><a href="/" class="hint">← Back to storefront</a></p>
  </div>
</main>

<div id="admin-app" class="shell hidden">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/"><span class="mark"><i data-lucide="book-open"></i></span> Mawego Bookshop</a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="admin-user" style="font-weight:700"></div>
      <div class="hint" id="admin-role"></div>
      <div style="display:flex;gap:.4rem;margin-top:.6rem">
        <a class="btn btn-sm" href="/"><i data-lucide="store"></i> Store</a>
        <button class="btn btn-sm" id="logout-btn"><i data-lucide="log-out"></i> Log out</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="offline hidden" id="offline-bar">You are offline — changes will fail until the connection returns.</div>
    <header class="topbar">
      <button class="btn btn-icon menu-btn" id="menu-btn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <button class="search-trigger" id="palette-btn"><i data-lucide="search"></i><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
      <div class="spacer"></div>
      <button class="btn btn-icon" id="help-btn" title="Keyboard shortcuts (?)"><i data-lucide="keyboard"></i></button>
      <button class="btn btn-icon" id="density-btn" title="Compact tables"><i data-lucide="rows-3"></i></button>
      <button class="btn btn-icon" id="refresh-btn" title="Refresh (R)"><i data-lucide="refresh-cw"></i></button>
      <button class="btn btn-icon" id="theme-btn" title="Toggle theme"><i data-lucide="moon"></i></button>
    </header>
    <div class="content" id="view-root"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script src="/js/api.js"></script>
<script src="/js/notifications.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   1. HELPERS
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (v) => escapeHtml(String(v ?? ''));
const kes = (v) => formatKes(Number(v) || 0);
const num = (v) => Number(v) || 0;
const label = (s) => String(s || '').replace(/_/g, ' ');
const ymd = (d) => d.toLocaleDateString('en-CA');
const fdate = (v) => (v ? String(v).slice(0, 10) : '—');
const DAY = 864e5;
const icons = (el) => { try { lucide.createIcons(el ? { nodes: [el] } : undefined); } catch {} };
const badge = (status, text) => `<span class="badge t-${esc(status || 'default')}">${esc(label(text ?? status))}</span>`;
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const arr = (v, k) => (Array.isArray(v) ? v : (v && Array.isArray(v[k]) ? v[k] : []));
const pct = (v) => (v == null || v === '' ? '—' : `${Math.round((Number(v) <= 1 ? Number(v) * 100 : Number(v)) * 10) / 10}%`);
const store = {
  get(k, d = null) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const STATUSES = (typeof ORDER_STATUSES !== 'undefined' && ORDER_STATUSES) || ['pending', 'confirmed', 'processing', 'ready', 'out_for_delivery', 'completed', 'cancelled'];

const STAFF_ROLES = ['staff', 'cashier', 'inventory', 'manager', 'owner'];
const isStaffUser = (u) => !!u && STAFF_ROLES.includes(u.role);

const copyText = async (txt, msg = 'Copied') => {
  try { await navigator.clipboard.writeText(txt); toast(msg); } catch { toast('Copy failed', 'error'); }
};

/* =====================================================================
   2. UI PRIMITIVES (toast, modal, confirm, csv, table, charts)
   ===================================================================== */
function toast(message, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type === 'error' ? 'error' : ''}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}"></i><span>${esc(message)}</span>`;
  $('#toasts').appendChild(el);
  icons(el);
  setTimeout(() => el.remove(), 4500);
}

async function guarded(fn) {
  try { return await fn(); }
  catch (err) {
    toast(err.message || 'Something went wrong', 'error');
    if (err.status === 401) { API.clearAuth(); showLogin(); }
  }
}

function openModal(html, cls = '') {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('.overlay', root).addEventListener('mousedown', (e) => { if (e.target.classList.contains('overlay')) closeModal(); });
  icons(root);
  const first = $('input:not([type=hidden]):not([type=file]):not([type=checkbox]),select,textarea', root);
  if (first) first.focus();
  return root;
}
const closeModal = () => { $('#modal-root').innerHTML = ''; };
const modalOpen = () => !!$('#modal-root .overlay');

function confirmDialog(title, message, okText = 'Confirm', danger = false) {
  return new Promise((resolve) => {
    openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn" id="cf-no">Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cf-yes">${esc(okText)}</button>
      </div>`);

function exportCSV(name, columns, rows) {
  const cols = columns.filter((c) => c.csv !== false && c.label);
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.map((c) => cell(c.label)).join(',')]
    .concat(rows.map((r) => cols.map((c) => cell(c.value ? c.value(r) : r[c.key])).join(',')))
    .join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `${name}-${ymd(new Date())}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported ${rows.length} rows`);
}

/* Sortable, paginated table. Options: columns, rows, sort, dir, pageSize, empty,
   onRow, onAction, rowClass, selectable, onSelect */
function mountTable(el, o) {
  let rows = o.rows || [], sort = o.sort || null, dir = o.dir || 'asc', page = 1;
  const size = o.pageSize || 15;
  const picked = new Set();
  const val = (c, r) => (c.value ? c.value(r) : r[c.key]);
  const sorted = () => {
    if (!sort) return rows;
    const c = o.columns.find((x) => x.key === sort);
    if (!c) return rows;
    const s = [...rows].sort((a, b) => {
      const x = val(c, a) ?? '', y = val(c, b) ?? '';
      return typeof x === 'number' && typeof y === 'number'
        ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' });
    });
    return dir === 'desc' ? s.reverse() : s;
  };
  const notify = () => o.onSelect && o.onSelect(rows.filter((r) => picked.has(String(r.id))));

  function draw() {
    const all = sorted();
    const pages = Math.max(1, Math.ceil(all.length / size));
    page = Math.min(page, pages);
    const slice = all.slice((page - 1) * size, page * size);
    const allOn = slice.length && slice.every((r) => picked.has(String(r.id)));
    const head = (o.selectable ? `<th class="sel"><input type="checkbox" data-all ${allOn ? 'checked' : ''} aria-label="Select page"></th>` : '') +
      o.columns.map((c) => {
        const s = c.sortable !== false && c.label;
        const arrow = sort === c.key ? (dir === 'asc' ? ' ▲' : ' ▼') : '';
        return `<th class="${s ? 'sortable' : ''} ${c.cls || ''}" ${s ? `data-sort="${c.key}"` : ''}>${esc(c.label)}${arrow}</th>`;
      }).join('');
    const span = o.columns.length + (o.selectable ? 1 : 0);
    const body = slice.length
      ? slice.map((r) => `<tr data-id="${esc(r.id)}" class="${o.onRow ? 'click' : ''} ${o.rowClass ? o.rowClass(r) : ''}">${
          o.selectable ? `<td class="sel"><input type="checkbox" data-pick ${picked.has(String(r.id)) ? 'checked' : ''}></td>` : ''}${
          o.columns.map((c) => `<td class="${c.cls || ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('')
      : `<tr><td class="empty" colspan="${span}">${o.empty || 'Nothing to show'}</td></tr>`;
    const pager = pages > 1
      ? `<span class="actions"><button class="btn btn-sm" data-pg="-1" ${page <= 1 ? 'disabled' : ''}>Prev</button>
         Page ${page} / ${pages}
         <button class="btn btn-sm" data-pg="1" ${page >= pages ? 'disabled' : ''}>Next</button></span>` : '';
    el.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
      <div class="pager"><span>${all.length} ${all.length === 1 ? 'row' : 'rows'}</span>${pager}</div>`;
    icons(el);
  }

  el.onclick = (e) => {
    if (e.target.matches('[data-all]')) {
      const all = sorted().slice((page - 1) * size, page * size);
      all.forEach((r) => (e.target.checked ? picked.add(String(r.id)) : picked.delete(String(r.id))));
      notify(); return draw();
    }
    const th = e.target.closest('[data-sort]');
    if (th) { dir = sort === th.dataset.sort && dir === 'asc' ? 'desc' : 'asc'; sort = th.dataset.sort; return draw(); }
    const pg = e.target.closest('[data-pg]');
    if (pg) { page += Number(pg.dataset.pg); return draw(); }
    const tr = e.target.closest('tbody tr[data-id]');
    if (!tr) return;
    if (e.target.matches('[data-pick]')) {
      e.target.checked ? picked.add(tr.dataset.id) : picked.delete(tr.dataset.id);
      notify(); return;
    }
    const row = rows.find((r) => String(r.id) === tr.dataset.id);
    if (!row) return;
    const btn = e.target.closest('[data-act]');
    if (btn && o.onAction) { e.stopPropagation(); return o.onAction(btn.dataset.act, row); }
    if (o.onRow && !e.target.closest('a,button,input')) o.onRow(row);
  };

  draw();
  return {
    setRows(r) { rows = r; page = 1; picked.clear(); notify(); draw(); },
    rows: sorted,
    selected: () => rows.filter((r) => picked.has(String(r.id))),
    clear() { picked.clear(); notify(); draw(); }
  };
}

const COLORS = ['#1f7a4d', '#2b6cb0', '#b7791f', '#8e44ad', '#c0392b', '#16a085', '#7f8c8d'];
function donut(items) {
  const total = items.reduce((s, i) => s + i.value, 0);
  if (!total) return '<p class="muted">No data for this period</p>';
  let acc = 0;
  const segs = items.map((it, i) => {
    const p = (it.value / total) * 100;
    const s = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${25 - acc}"/>`;
    acc += p; return s;
  }).join('');
  const legend = items.map((it, i) => `<div><i class="dot" style="background:${COLORS[i % COLORS.length]}"></i>
    <span>${esc(label(it.label))}</span><b>${esc(it.display)}</b><span class="hint">${Math.round(it.value / total * 100)}%</span></div>`).join('');
  return `<div class="donut-wrap"><svg width="150" height="150" viewBox="0 0 42 42">${segs}</svg><div class="legend">${legend}</div></div>`;
}
function hbars(items) {
  if (!items.length) return '<p class="muted">No data for this period</p>';
  const max = Math.max(...items.map((i) => i.value), 1);
  return `<div class="bars">${items.map((i) => `<div class="bar">
    <div class="top"><span>${esc(i.label)}</span><b>${esc(i.display)}</b></div>
    <div class="track"><div class="fill" style="width:${(i.value / max * 100).toFixed(1)}%"></div></div>
    ${i.sub ? `<div class="hint">${esc(i.sub)}</div>` : ''}</div>`).join('')}</div>`;
}
function trend(points) {
  const max = Math.max(...points.map((p) => p.value), 1);
  return `<div class="trend">${points.map((p) => `<div class="col" title="${esc(p.title)}">
    <div class="b" style="height:${(p.value / max * 100).toFixed(1)}%"></div><div class="d">${esc(p.label)}</div></div>`).join('')}</div>`;
}
const delta = (cur, prev) => {
  if (!prev) return '';
  const d = Math.round((cur - prev) / prev * 100);
  return `<span class="delta ${d < 0 ? 'neg' : 'pos'}">${d < 0 ? '▼' : '▲'} ${Math.abs(d)}%</span>`;
};

function rangeToolbar(root, run, pre = 'month') {
  const now = new Date();
  const presets = {
    today: () => [now, now],
    '7d': () => [new Date(now - 6 * DAY), now],
    '30d': () => [new Date(now - 29 * DAY), now],
    month: () => [new Date(now.getFullYear(), now.getMonth(), 1), now],
    lastmonth: () => [new Date(now.getFullYear(), now.getMonth() - 1, 1), new Date(now.getFullYear(), now.getMonth(), 0)],
    year: () => [new Date(now.getFullYear(), 0, 1), now]
  };
  const names = { today: 'Today', '7d': '7 days', '30d': '30 days', month: 'This month', lastmonth: 'Last month', year: 'This year' };
  const [f, t] = presets[pre]();
  root.innerHTML = `<div class="chips">${Object.keys(presets).map((k) => `<button class="chip ${k === pre ? 'on' : ''}" data-preset="${k}">${names[k]}</button>`).join('')}</div>
    <div class="toolbar">
      <div><label>From</label><input type="date" id="r-from" value="${ymd(f)}"></div>
      <div><label>To</label><input type="date" id="r-to" value="${ymd(t)}"></div>
      <button class="btn btn-primary btn-sm" id="r-run"><i data-lucide="play"></i> Run</button>
    </div>`;
  icons(root);
  const runNow = () => run($('#r-from').value, $('#r-to').value);
  $$('[data-preset]', root).forEach((b) => {
    b.onclick = () => {
      $$('[data-preset]', root).forEach((x) => x.classList.toggle('on', x === b));
      const [a, z] = presets[b.dataset.preset]();
      $('#r-from').value = ymd(a); $('#r-to').value = ymd(z); runNow();
    };
  });
  $('#r-run').onclick = runNow;
  runNow();
}
/* Previous period of equal length, immediately before [from, to] */
function prevRange(from, to) {
  const f = new Date(from + 'T00:00:00'), t = new Date(to + 'T00:00:00');
  const days = Math.round((t - f) / DAY) + 1;
  const pt = new Date(f - DAY), pf = new Date(pt - (days - 1) * DAY);
  return [ymd(pf), ymd(pt)];
}

const pageHead = (title, sub, actions = '') =>

function parseHash() {

async function route() {
  if (!isStaffUser(API.getUser())) return showLogin();
  let { view, params } = parseHash();
  if (!VIEWS[view] || !can(view)) { view = 'dashboard'; params = {}; }
  currentView = view;

  const root = $('#view-root'), token = ++navToken;
  root.innerHTML = '<div class="loading"><i data-lucide="loader-2" class="spin"></i></div>';
  icons(root);
  try {
    const html = document.createElement('div');
    await VIEWS[view](html, params);
    if (token !== navToken) return;
    root.replaceChildren(...html.childNodes);
    icons(root);
    document.title = `${NAV.find((n) => n.id === view)?.label || 'Admin'} — Mawego Admin`;
    window.scrollTo(0, 0);

    if (token !== navToken) return;
    root.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
    if (err.status === 401) { API.clearAuth(); showLogin(); }

function startPolling() {
  clearInterval(pollTimer);
  const tick = async () => {
    if (document.hidden || !can('dashboard') || !isStaffUser(API.getUser())) return;
    try {
      const d = await API.adminDashboard();
      badges.orders = num(d.pending_orders);

    pageSize: 6, empty: 'All products are well stocked',
    rows: (d.low_stock_products || []).map((p) => ({ ...p, id: p.id ?? p.name })),
    onAction: (a, p) => openPOModal(p.id),
    columns: [
      { key: 'name', label: 'Product' },
      { key: 'stock_qty', label: 'Qty', value: (p) => num(p.stock_qty), render: (p) => `<b class="${num(p.stock_qty) <= 0 ? 'neg' : ''}">${esc(p.stock_qty)}</b>` },
      { key: 'low_stock_threshold', label: 'Min' },
      { key: 'x', label: '', sortable: false, csv: false, cls: 'right', render: () => '<button class="btn btn-sm btn-soft" data-act="po"><i data-lucide="truck"></i> Reorder</button>' }
    ]
  });

  $$('[data-q]', root).forEach((b) => {
    b.onclick = () => guarded(async () => {
      const k = b.dataset.q;
      if (k === 'product') openProductForm(null, (await API.categories()).categories);
      if (k === 'expense') openExpenseModal();
      if (k === 'po') openPOModal();
      if (k === 'stock') go('inventory', { state: 'alerts' });
    });
  });
  const ar = $('#auto-refresh', root);
  ar.checked = sessionStorage.getItem('autoRefresh') === '1';
  ar.onchange = () => { sessionStorage.setItem('autoRefresh', ar.checked ? '1' : '0'); setAuto(); };
}

let autoTimer;
function setAuto() {
  clearInterval(autoTimer);
  if (sessionStorage.getItem('autoRefresh') === '1') {
    autoTimer = setInterval(() => { if (currentView === 'dashboard' && !modalOpen() && !document.hidden) route(); }, 60000);
  }
}
setAuto();

   5. ORDERS
   ===================================================================== */
async function renderOrders(root, params) {
  const { orders } = await API.adminOrders({ limit: 500 });
  let status = params.status || '';
  const today = ymd(new Date());
  const countOf = (s) => (s ? orders.filter((o) => o.order_status === s).length : orders.length);

  root.innerHTML = `
    ${pageHead('Orders', `${orders.length} most recent orders`, '<button class="btn" id="o-export"><i data-lucide="download"></i> Export CSV</button>')}
    <div class="chips" id="o-chips">${['', ...STATUSES].map((s) => `<button class="chip" data-s="${s}">${s ? label(s) : 'All'} <b>${countOf(s)}</b></button>`).join('')}</div>
    <div class="toolbar">
      <input id="o-q" type="search" placeholder="Search order #, name, phone…" value="${esc(params.q || '')}">
      <select id="o-pay"><option value="">Any payment</option><option value="paid">Paid</option><option value="unpaid">Unpaid / pending</option></select>
      <select id="o-ful"><option value="">Pickup & delivery</option><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select>
      <select id="o-period"><option value="">All time</option><option value="today">Today</option><option value="7d">Last 7 days</option></select>
    </div>
    <div id="o-bulk"></div>
    <div class="table-wrap" id="o-table"></div>`;
  $('#o-period', root).value = params.period || '';

  const cols = [
    { key: 'order_number', label: 'Order', render: (o) => `<b>${esc(o.order_number)}</b>` },
    { key: 'customer_name', label: 'Customer', render: (o) => `${esc(o.customer_name)}<div class="hint">${esc(o.customer_phone)}</div>` },
    { key: 'total_kes', label: 'Total', value: (o) => num(o.total_kes), render: (o) => `<b>${kes(o.total_kes)}</b>` },
    { key: 'payment_status', label: 'Payment', render: (o) => `${badge(o.payment_status)}<div class="hint">${esc(o.payment_method)}</div>` },
    { key: 'order_status', label: 'Status', render: (o) => badge(o.order_status) },
    { key: 'created_at', label: 'Date', cls: 'nowrap', render: (o) => `<span class="hint">${esc(o.created_at)}</span>` },
    { key: 'a', label: '', sortable: false, csv: false, cls: 'right', render: (o) => {
      const n = nextStatus(o);
      return `<div class="row-actions">
        ${n ? `<button class="btn btn-sm btn-soft" data-act="next" title="Move to ${label(n)}"><i data-lucide="arrow-right"></i> ${label(n)}</button>` : ''}
        <a class="btn btn-sm" href="/pages/receipt.html?id=${o.id}" target="_blank" title="Receipt"><i data-lucide="receipt"></i></a>
      </div>`;
    } }
  ];

  const showBulk = bulkBar($('#o-bulk', root), [
    { id: 'adv', icon: 'arrow-right', text: 'Advance status', run: (sel) => bulkAdvance(sel) },
    { id: 'paid', icon: 'banknote', text: 'Mark paid', run: (sel) => bulkPaid(sel) },
    { id: 'copy', icon: 'copy', text: 'Copy phones', run: (sel) => copyText([...new Set(sel.map((o) => o.customer_phone).filter(Boolean))].join(', '), 'Phones copied') }
  ]);

  const t = mountTable($('#o-table', root), {
    columns: cols, rows: [], sort: 'created_at', dir: 'desc', empty: 'No orders found', selectable: true, onSelect: showBulk,
    onRow: (o) => openOrderModal(o.id),
    onAction: (a, o) => guarded(async () => {
      const n = nextStatus(o);
      if (!n) return;
      await API.adminUpdateOrder(o.id, { order_status: n });
      toast(`${o.order_number} → ${label(n)}`);
      route();
    })
  });

  async function bulkAdvance(sel) {
    const movable = sel.filter(nextStatus);
    if (!movable.length) return toast('None of the selected orders can advance', 'error');
    if (!(await confirmDialog('Advance orders', `Move ${movable.length} order(s) to their next status?`, 'Advance'))) return;
    guarded(async () => {
      let ok = 0;
      for (const o of movable) { try { await API.adminUpdateOrder(o.id, { order_status: nextStatus(o) }); ok++; } catch {} }
      toast(`${ok}/${movable.length} orders advanced`, ok ? 'success' : 'error');
      route();
    });
  }
  async function bulkPaid(sel) {
    const unpaid = sel.filter((o) => o.payment_status !== 'paid');
    if (!unpaid.length) return toast('All selected orders are already paid', 'error');
    if (!(await confirmDialog('Mark as paid', `Mark ${unpaid.length} order(s) as paid?`, 'Mark paid'))) return;
    guarded(async () => {
      let ok = 0;
      for (const o of unpaid) { try { await API.adminMarkPaid(o.id); ok++; } catch {} }
      toast(`${ok}/${unpaid.length} orders marked paid`, ok ? 'success' : 'error');
      route();
    });
  }

  const apply = () => {
    const q = $('#o-q', root).value.trim().toLowerCase();
    const pay = $('#o-pay', root).value, ful = $('#o-ful', root).value, per = $('#o-period', root).value;
    const since = per === '7d' ? ymd(new Date(Date.now() - 6 * DAY)) : '';
    t.setRows(orders.filter((o) => {
      const day = String(o.created_at || '').slice(0, 10);
      return (!status || o.order_status === status) &&
        (!pay || (pay === 'paid' ? o.payment_status === 'paid' : o.payment_status !== 'paid')) &&
        (!ful || o.fulfilment_type === ful) &&
        (per !== 'today' || day === today) && (!since || day >= since) &&
        (!q || [o.order_number, o.customer_name, o.customer_phone].some((v) => String(v || '').toLowerCase().includes(q)));
    }));
    $$('#o-chips .chip', root).forEach((c) => c.classList.toggle('on', c.dataset.s === status));
  };
  $$('#o-chips .chip', root).forEach((c) => { c.onclick = () => { status = c.dataset.s; apply(); }; });
  $('#o-q', root).oninput = debounce(apply, 150);
  ['o-pay', 'o-ful', 'o-period'].forEach((id) => { $('#' + id, root).onchange = apply; });
  $('#o-export', root).onclick = () => exportCSV('orders', cols, t.rows());
  apply();
}

      <div class="table-wrap"><table>

        <tbody>

          <tr><td colspan="2"><b>Total</b></td><td class="right"><b>${kes(order.total_kes)}</b></td></tr>
        </tbody>
      </table></div>
      <div class="form-group" style="margin-top:1rem"><label>Order status</label>
        <select id="m-status">${STATUSES.map((s) => `<option value="${s}" ${order.order_status === s ? 'selected' : ''}>${label(s)}</option>`).join('')}</select></div>
      <div class="modal-actions">

        <button class="btn" id="m-close">Close</button>

    $('#m-wa').onclick = () => {
      const phone = String(order.customer_phone || '').replace(/[^\d]/g, '').replace(/^0/, '254');
      const text = `Hello ${order.customer_name}, your Mawego Bookshop order ${order.order_number} is now ${label(order.order_status)}.`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');

  });
}

/* =====================================================================
   6. CUSTOMERS (derived from the existing orders endpoint)
   ===================================================================== */
async function renderCustomers(root, params) {
  const { orders } = await API.adminOrders({ limit: 500 });
  const map = new Map();
  orders.forEach((o) => {
    if (o.order_status === 'cancelled') return;
    const key = String(o.customer_phone || o.customer_name || o.id).replace(/\s+/g, '');
    const c = map.get(key) || { id: key, name: o.customer_name, phone: o.customer_phone, orders: [], spent: 0, last: '' };
    c.orders.push(o); c.spent += num(o.total_kes);
    if (String(o.created_at) > c.last) c.last = String(o.created_at);
    map.set(key, c);
  });
  const customers = [...map.values()].map((c) => ({ ...c, count: c.orders.length, avg: c.spent / c.orders.length, repeat: c.orders.length > 1 }));
  const repeat = customers.filter((c) => c.repeat).length;
  const total = customers.reduce((s, c) => s + c.spent, 0);

  root.innerHTML = `
    ${pageHead('Customers', 'Built from your most recent 500 orders', '<button class="btn" id="cu-export"><i data-lucide="download"></i> Export CSV</button>')}
    <div class="grid-stats">
      ${statCard({ icon: 'users', label: 'Customers', value: customers.length })}
      ${statCard({ icon: 'repeat', label: 'Repeat buyers', value: repeat, sub: customers.length ? `${Math.round(repeat / customers.length * 100)}% of customers` : '', tone: 'info' })}
      ${statCard({ icon: 'banknote', label: 'Avg lifetime value', value: kes(customers.length ? total / customers.length : 0) })}
    </div>
    <div class="toolbar">
      <input id="cu-q" type="search" placeholder="Search name or phone…" value="${esc(params.q || '')}">
      <select id="cu-f"><option value="">All customers</option><option value="repeat">Repeat only</option><option value="new">One-time only</option></select>
    </div>
    <div class="table-wrap" id="cu-table"></div>`;

  const cols = [
    { key: 'name', label: 'Customer', render: (c) => `<b>${esc(c.name)}</b><div class="hint">${esc(c.phone)}</div>` },
    { key: 'count', label: 'Orders' },
    { key: 'spent', label: 'Total spent', value: (c) => c.spent, render: (c) => `<b>${kes(c.spent)}</b>` },
    { key: 'avg', label: 'Avg order', value: (c) => c.avg, render: (c) => kes(c.avg) },
    { key: 'last', label: 'Last order', cls: 'nowrap', render: (c) => esc(fdate(c.last)) },
    { key: 'repeat', label: 'Type', value: (c) => (c.repeat ? 1 : 0), render: (c) => badge(c.repeat ? 'ok' : 'default', c.repeat ? 'Repeat' : 'New') }
  ];
  const t = mountTable($('#cu-table', root), {
    columns: cols, rows: [], sort: 'spent', dir: 'desc', empty: 'No customers yet',
    onRow: (c) => {
      openModal(`<h2>${esc(c.name)}</h2>
        <dl class="kv"><dt>Phone</dt><dd><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></dd><dt>Orders</dt><dd>${c.count}</dd><dt>Total spent</dt><dd>${kes(c.spent)}</dd></dl>
        <div class="table-wrap"><table><thead><tr><th>Order</th><th>Date</th><th class="right">Total</th></tr></thead><tbody>
        ${c.orders.slice(0, 15).map((o) => `<tr><td>${esc(o.order_number)}</td><td>${esc(fdate(o.created_at))}</td><td class="right">${kes(o.total_kes)}</td></tr>`).join('')}</tbody></table></div>
        <div class="modal-actions"><button class="btn" id="cm-copy"><i data-lucide="copy"></i> Copy phone</button><button class="btn btn-primary" id="cm-close">Close</button></div>`);
      $('#cm-close').onclick = closeModal;
      $('#cm-copy').onclick = () => copyText(c.phone || '', 'Phone copied');
    }
  });
  const apply = () => {
    const q = $('#cu-q', root).value.trim().toLowerCase(), f = $('#cu-f', root).value;
    t.setRows(customers.filter((c) => (!f || (f === 'repeat') === c.repeat) && (!q || `${c.name} ${c.phone}`.toLowerCase().includes(q))));
  };
  $('#cu-q', root).oninput = debounce(apply, 150);
  $('#cu-f', root).onchange = apply;
  $('#cu-export', root).onclick = () => exportCSV('customers', cols, t.rows());
  apply();
}

  }));

    ${pageHead('Products', `${products.length} books and items`, `
      <button class="btn" id="p-export"><i data-lucide="download"></i> Export CSV</button>
      <button class="btn" id="p-import"><i data-lucide="upload"></i> Import JSON</button>

      <input id="p-q" type="search" placeholder="Search name, SKU, barcode, category…" value="${esc(params.q || '')}">

    <div class="table-wrap" id="p-table"></div>`;

  const cols = [
    { key: 'image_url', label: '', sortable: false, csv: false, render: (p) => (p.image_url ? `<img class="thumb" loading="lazy" src="${esc(p.image_url)}" alt="">` : '<span class="thumb"></span>') },
    { key: 'sku', label: 'SKU', render: (p) => esc(p.sku || '—') },
    { key: 'name', label: 'Name', render: (p) => `<b>${esc(p.name)}</b>${p.barcode ? `<div class="hint">${esc(p.barcode)}</div>` : ''}` },
    { key: 'category_name', label: 'Category', render: (p) => esc(p.category_name || '—') },
    { key: 'cost_kes', label: 'Buying', value: (p) => num(p.cost_kes), render: (p) => kes(p.cost_kes) },
    { key: 'price_kes', label: 'Selling', value: (p) => num(p.price_kes), render: (p) => kes(p.price_kes) },
    { key: '_margin', label: 'Margin', render: (p) => `<span class="${p._margin < 15 ? 'neg' : 'pos'}">${p._margin}%</span>` },
    { key: 'stock_qty', label: 'Qty', value: (p) => num(p.stock_qty) },
    { key: 'state', label: 'Status', value: stateOf, render: statePill },
    { key: 'a', label: '', sortable: false, csv: false, cls: 'right', render: () => `
      <div class="row-actions">
        <button class="btn btn-sm" data-act="edit" title="Edit"><i data-lucide="pencil"></i></button>
        <button class="btn btn-sm" data-act="dup" title="Duplicate"><i data-lucide="copy"></i></button>
        <button class="btn btn-sm" data-act="stock" title="Adjust stock"><i data-lucide="package"></i></button>
        <button class="btn btn-sm btn-danger" data-act="del" title="Delete"><i data-lucide="trash-2"></i></button>
      </div>` }
  ];

  const showBulk = bulkBar($('#p-bulk', root), [
    { id: 'po', icon: 'truck', text: 'Reorder selected', run: (sel) => openPOModal(null, sel.map((p) => p.id)) },
    { id: 'sku', icon: 'copy', text: 'Copy SKUs', run: (sel) => copyText(sel.map((p) => p.sku).filter(Boolean).join(', '), 'SKUs copied') }
  ]);

  const t = mountTable($('#p-table', root), {
    columns: cols, rows: [], pageSize: 20, sort: 'name', empty: 'No products match your search', selectable: true, onSelect: showBulk,
    rowClass: (p) => (stateOf(p) === 'archived' ? 'dim' : ''),
    onRow: (p) => openProductForm(p, categories),
    onAction: (a, p) => ({
      edit: () => openProductForm(p, categories),
      dup: () => openProductForm(p, categories, true),
      stock: () => openStockModal(p),
      del: () => deleteProduct(p)
    })[a]()
  });

  const apply = () => {
    const q = $('#p-q', root).value, cat = $('#p-cat', root).value, st = $('#p-state', root).value, mg = $('#p-margin', root).value;
    const list = products.filter((p) => matches(p, q) && (!cat || p.category_name === cat) && (!st || stateOf(p) === st) &&
      (!mg || (mg === 'low' ? p._margin < 15 : num(p.price_kes) < num(p.cost_kes))));

  ['p-cat', 'p-state', 'p-margin'].forEach((id) => { $('#' + id, root).onchange = apply; });
  $('#p-new', root).onclick = () => openProductForm(null, categories);
  $('#p-import', root).onclick = importProducts;
  $('#p-export', root).onclick = () => exportCSV('products', cols, t.rows());
  apply();
}

function importProducts() {
  openModal(`
    <h2>Import products</h2>
    <p class="muted">Paste a JSON array or choose a .json file.</p>
    <div class="form-group"><input type="file" id="imp-file" accept=".json,application/json"></div>
    <div class="form-group"><textarea id="imp-text" rows="9" placeholder='[{ "name":"Exercise book", "price_kes":100, "cost_kes":60, "sku":"EB-01", "stock_qty":10, "category_slug":"stationery" }]'></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="imp-cancel">Cancel</button>
      <button class="btn btn-primary" id="imp-go"><i data-lucide="upload"></i> Import</button>
    </div>`);
  $('#imp-file').onchange = async (e) => { const f = e.target.files[0]; if (f) $('#imp-text').value = await f.text(); };
  $('#imp-cancel').onclick = closeModal;
  $('#imp-go').onclick = () => {
    let list;
    try { list = JSON.parse($('#imp-text').value); if (!Array.isArray(list)) throw 0; }
    catch { return toast('Not a valid JSON array', 'error'); }
    guarded(async () => {
      const r = await API.adminImportProducts(list);
      closeModal(); toast(`Imported ${r.created}, skipped ${r.skipped}`); route();
    });
  };
}

  openModal(`

      <div class="form-group"><label>Book name *</label><input name="name" required value="${esc(p.name)}"></div>
      <div class="form-group"><label>Category</label>
        <select name="category_id"><option value="">No category</option>
          ${categories.map((c) => `<option value="${c.id}" ${String(p.category_id) === String(c.id) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select></div>
      <div class="form-row">
        <div class="form-group"><label>SKU</label><input name="sku" value="${esc(p.sku)}"></div>
        <div class="form-group"><label>Barcode</label><input name="barcode" value="${esc(p.barcode)}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Buying price (KES)</label><input name="cost_kes" id="pf-cost" type="number" step="0.01" min="0" value="${p.cost_kes ?? 0}"></div>
        <div class="form-group"><label>Selling price (KES) *</label><input name="price_kes" id="pf-price" type="number" step="0.01" min="0" required value="${p.price_kes ?? ''}"></div>
      </div>

      <details><summary>Sale pricing (optional)</summary>

      </div>
    </form>`);

  const margin = () => {
    const c = num($('#pf-cost').value), s = num($('#pf-price').value);
    $('#pf-margin').innerHTML = s ? `Profit per unit <b class="${s < c ? 'neg' : 'pos'}">${kes(s - c)}</b> · margin ${Math.round((s - c) / s * 100)}%` : '';
  };
  $('#pf-cost').oninput = margin; $('#pf-price').oninput = margin; margin();
  $('#pf-close').onclick = closeModal;
  $('#pf-image').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    $('#pf-preview').src = URL.createObjectURL(f); $('#pf-preview').classList.remove('hidden');
  };

  $('#prod-form').onsubmit = (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target); btn.disabled = true;
    guarded(async () => {
      const form = e.target, fd = new FormData(form);
      if (num(fd.get('price_kes')) < num(fd.get('cost_kes')) &&
          !(await confirmDialog('Selling below cost', 'The selling price is lower than the buying price. Save anyway?', 'Save anyway'))) return;
      fd.set('is_active', form.is_active.checked ? '1' : '0');
      const img = fd.get('image');
      if (img && img.size === 0) fd.delete('image');

      if (isEdit) {
        const newQty = num(fd.get('stock_qty'));
        fd.delete('stock_qty');
        await API.adminUpdateProduct(product.id, fd);
        const d = newQty - num(product.stock_qty);
        if (d) await API.adminAdjustStock(product.id, { change_qty: d, reason: 'count', notes: 'Edited in product form' });
        toast('Product updated');
      } else {
        await API.adminCreateProduct(fd);
        toast(form.is_active.checked ? 'Product added and published' : 'Product added as inactive');
      }
      closeModal(); route();
    }).then(() => { btn.disabled = false; });
  };
}

/* =====================================================================
   8. PROMOTIONS (shared normaliser used by Marketing too)
   ===================================================================== */
function promoStatus(c) {
  const now = Date.now();
  if (!c.is_active) return 'inactive';
  if (c.expires_at && new Date(c.expires_at) < now) return 'expired';
  if (c.starts_at && new Date(c.starts_at) > now) return 'scheduled';
  if (c.usage_limit != null && num(c.used_count) >= num(c.usage_limit)) return 'used_up';
  return 'active';
}
const promoValue = (c) => (c.discount_type === 'percent' ? `${num(c.discount_value)}% off` : `${kes(c.discount_value)} off`);
const normPromo = (p, i) => ({
  ...p, id: p.id ?? p.code ?? i, code: p.code || '',
  used: num(p.used_count), max: p.usage_limit != null ? num(p.usage_limit) : 0,
  state: promoStatus(p)
});
const PROMO_STATES = ['active', 'scheduled', 'inactive', 'expired', 'used_up'];

async function renderPromotions(root, params) {
  const data = await API.adminPromos();
  const coupons = arr(data, 'promos').map(normPromo);
  let filter = PROMO_STATES.includes(params.filter) ? params.filter : '';

  root.innerHTML = `
    ${pageHead('Promotions & Coupons', 'Create and manage discount codes for the storefront', '<button class="btn btn-primary" id="c-new"><i data-lucide="plus"></i> New coupon</button>')}
    <div class="chips" id="c-chips">
      <button class="chip" data-s="">All <b>${coupons.length}</b></button>
      ${PROMO_STATES.map((s) => `<button class="chip" data-s="${s}">${label(s)} <b>${coupons.filter((c) => c.state === s).length}</b></button>`).join('')}
    </div>
    <div class="toolbar"><input id="c-q" type="search" placeholder="Search code or description…"></div>
    <div class="table-wrap" id="c-table"></div>`;

  const cols = [
    { key: 'code', label: 'Code', render: (c) => `<b style="letter-spacing:.04em">${esc(c.code)}</b>${c.description ? `<div class="hint">${esc(c.description)}</div>` : ''}` },
    { key: 'discount_value', label: 'Discount', value: (c) => num(c.discount_value), render: (c) =>
      promoValue(c) + (c.discount_type === 'percent' && c.max_discount_kes != null ? `<div class="hint">max ${kes(c.max_discount_kes)}</div>` : '') },
    { key: 'min_order_kes', label: 'Min order', value: (c) => num(c.min_order_kes), render: (c) => (num(c.min_order_kes) ? kes(c.min_order_kes) : '—') },
    { key: 'used', label: 'Used', value: (c) => c.used, render: (c) => (c.max
      ? `<div class="usage"><div class="track"><div class="fill" style="width:${Math.min(100, c.used / c.max * 100)}%"></div></div><span class="hint nowrap">${c.used}/${c.max}</span></div>` : String(c.used)) },
    { key: 'per_user_limit', label: 'Per customer', render: (c) => (c.per_user_limit ? String(c.per_user_limit) : '—') },
    { key: 'expires_at', label: 'Expires', cls: 'nowrap', value: (c) => c.expires_at || '9999', render: (c) => (c.expires_at ? esc(fdate(c.expires_at)) : 'Never') },
    { key: 'state', label: 'Status', render: (c) => badge(c.state, label(c.state)) },
    { key: 'a', label: '', sortable: false, csv: false, cls: 'right', render: (c) => `
      <div class="row-actions">
        <button class="btn btn-sm" data-act="copy" title="Copy code"><i data-lucide="copy"></i></button>
        <button class="btn btn-sm" data-act="dup" title="Duplicate"><i data-lucide="files"></i></button>
        <button class="btn btn-sm" data-act="edit" title="Edit"><i data-lucide="pencil"></i></button>
        <button class="btn btn-sm" data-act="toggle" title="${c.is_active ? 'Deactivate' : 'Activate'}"><i data-lucide="${c.is_active ? 'toggle-right' : 'toggle-left'}"></i></button>
        ${c.is_active ? '<button class="btn btn-sm btn-danger" data-act="del" title="Deactivate"><i data-lucide="trash-2"></i></button>' : ''}
      </div>` }
  ];
  const t = mountTable($('#c-table', root), {
    columns: cols, rows: [], pageSize: 20, sort: 'code', empty: 'No coupons yet',
    rowClass: (c) => (['expired', 'inactive', 'used_up'].includes(c.state) ? 'dim' : ''),
    onAction: (act, c) => ({
      copy: () => copyText(c.code, 'Code copied'),
      dup: () => openCouponForm({ ...c, code: `${c.code}-2`, used_count: 0 }, true),
      edit: () => openCouponForm(c),
      toggle: () => toggleCoupon(c),
      del: () => deleteCoupon(c)
    })[act]()
  });
  const apply = () => {
    const q = $('#c-q', root).value.trim().toLowerCase();
    t.setRows(coupons.filter((c) => (!filter || c.state === filter) && (!q || `${c.code} ${c.description || ''}`.toLowerCase().includes(q))));
    $$('#c-chips .chip', root).forEach((ch) => ch.classList.toggle('on', ch.dataset.s === filter));
  };
  $$('#c-chips .chip', root).forEach((ch) => { ch.onclick = () => { filter = ch.dataset.s; apply(); }; });
  $('#c-q', root).oninput = debounce(apply, 150);
  $('#c-new', root).onclick = () => openCouponForm(null);
  apply();
}

function openCouponForm(coupon, duplicate = false) {
  const isEdit = !!coupon && !duplicate, c = coupon || {};
  const dateVal = (v) => (v ? String(v).slice(0, 10) : '');
  openModal(`
    <h2>${isEdit ? 'Edit coupon' : 'New coupon'}</h2>
    <form id="cpn-form">
      <div class="form-row">
        <div class="form-group"><label>Code * <span class="hint">(3–40 letters, numbers, - or _)</span></label>
          <input name="code" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_\\-]{3,40}" style="text-transform:uppercase" value="${esc(c.code || '')}" placeholder="e.g. BACK2SCHOOL"></div>
        <div class="form-group"><label>Type *</label>
          <select name="discount_type" id="cpn-type">
            <option value="percent" ${c.discount_type !== 'fixed' ? 'selected' : ''}>Percentage (%)</option>
            <option value="fixed" ${c.discount_type === 'fixed' ? 'selected' : ''}>Fixed amount (KES)</option>
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label id="cpn-value-label">Value *</label><input name="discount_value" type="number" step="0.01" min="0.01" required value="${c.discount_value ?? ''}"></div>
        <div class="form-group" id="cpn-max-wrap"><label>Max discount (KES)</label><input name="max_discount_kes" type="number" step="0.01" min="0" value="${c.max_discount_kes ?? ''}" placeholder="Optional ceiling for %"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Minimum order (KES)</label><input name="min_order_kes" type="number" step="0.01" min="0" value="${c.min_order_kes ?? ''}"></div>
        <div class="form-group"><label>Total usage limit</label><input name="usage_limit" type="number" min="1" step="1" value="${c.usage_limit ?? ''}" placeholder="Leave empty = unlimited"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Per-customer limit</label><input name="per_user_limit" type="number" min="1" step="1" value="${c.per_user_limit ?? 1}"><div class="hint">Defaults to 1 use per customer.</div></div>
        <div class="form-group"><label>Starts</label><input name="starts_at" type="date" value="${dateVal(c.starts_at)}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Expires (end of day)</label><input name="expires_at" type="date" value="${dateVal(c.expires_at)}"></div>
        <div class="form-group"><label>Description</label><input name="description" value="${esc(c.description || '')}" placeholder="Optional note"></div>
      </div>
      <label class="check"><input type="checkbox" name="is_active" ${!isEdit || c.is_active ? 'checked' : ''}> Active — customers can use this code</label>
      <div class="modal-actions">
        <button type="button" class="btn" id="cpn-close">Cancel</button>
        <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> ${isEdit ? 'Save changes' : 'Create coupon'}</button>
      </div>
    </form>`);

  const typeEl = $('#cpn-type');
  const syncType = () => {
    const isPct = typeEl.value === 'percent';
    $('#cpn-value-label').textContent = isPct ? 'Percentage (%) *' : 'Amount (KES) *';
    $('#cpn-max-wrap').style.display = isPct ? '' : 'none';
    $('#cpn-form [name=discount_value]').max = isPct ? '100' : '';
  };
  typeEl.onchange = syncType; syncType();
  $('#cpn-close').onclick = closeModal;

  $('#cpn-form').onsubmit = (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target); btn.disabled = true;
    guarded(async () => {
      const fd = new FormData(e.target);
      const opt = (k) => (fd.get(k) ? num(fd.get(k)) : null);
      const starts = fd.get('starts_at'), ends = fd.get('expires_at');
      const isPct = fd.get('discount_type') === 'percent';
      if (starts && ends && starts > ends) return toast('Expiry must be after the start date', 'error');
      const payload = {
        code: String(fd.get('code') || '').trim().toUpperCase(),
        discount_type: fd.get('discount_type'),
        discount_value: num(fd.get('discount_value')),
        max_discount_kes: isPct ? opt('max_discount_kes') : null,
        min_order_kes: num(fd.get('min_order_kes')),
        usage_limit: opt('usage_limit'),
        per_user_limit: opt('per_user_limit') || 1,
        starts_at: starts ? new Date(`${starts}T00:00:00`).toISOString() : null,
        expires_at: ends ? new Date(`${ends}T23:59:59`).toISOString() : null,
        description: String(fd.get('description') || '').trim(),
        is_active: !!fd.get('is_active')
      };
      if (isEdit) { await API.put('/admin/promos/' + encodeURIComponent(coupon.id), payload); toast('Coupon updated'); }
      else { await API.adminCreatePromo(payload); toast('Coupon created'); }
      closeModal(); route();
    }).then(() => { btn.disabled = false; });
  };
}

async function toggleCoupon(c) {
  const next = !c.is_active;
  const ok = await confirmDialog(next ? 'Activate coupon' : 'Deactivate coupon', `${c.code} will become ${next ? 'available' : 'unavailable'} to customers.`, next ? 'Activate' : 'Deactivate');
  if (!ok) return;
  guarded(async () => {
    await API.put('/admin/promos/' + encodeURIComponent(c.id), { is_active: next });
    toast(next ? 'Coupon activated' : 'Coupon deactivated'); route();
  });
}
async function deleteCoupon(c) {
  const ok = await confirmDialog('Deactivate coupon', `${c.code} will be disabled and customers can no longer use it. Past orders keep their discount history.`, 'Deactivate', true);
  if (!ok) return;
  guarded(async () => { await API.del('/admin/promos/' + encodeURIComponent(c.id)); toast('Coupon deactivated'); route(); });
}

async function renderInventory(root, params) {
  const { products, totals } = await API.adminInventory();

  const low = products.filter((p) => stateOf(p) === 'low').length;
  badges.inventory = low + out;
  renderNav();

  const stockValue = (p) => num(p.stock_value_cost ?? p.stock_qty * (p.cost_kes || 0));
  const byCat = {};
  products.forEach((p) => { const k = p.category_name || 'Uncategorised'; byCat[k] = (byCat[k] || 0) + stockValue(p); });

  root.innerHTML = `
    ${pageHead('Inventory', 'Stock levels and valuation',

    <div class="grid-stats">

      ${statCard({ icon: 'wallet', label: 'Value (buying)', value: kes(totals.value_cost) })}
      ${statCard({ icon: 'tags', label: 'Value (selling)', value: kes(totals.value_retail), sub: `Potential profit ${kes(potential)}`, tone: 'info' })}
      ${statCard({ href: link('inventory', { state: 'low' }), icon: 'alert-triangle', label: 'Low stock', value: low, tone: low ? 'warn' : '' })}
      ${statCard({ href: link('inventory', { state: 'out' }), icon: 'x-octagon', label: 'Out of stock', value: out, tone: out ? 'bad' : '' })}
    </div>
    <div class="card" style="margin-bottom:1.1rem">
      <div class="card-head"><h2>Stock value by category</h2></div>
      ${hbars(Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => ({ label: k, value: v, display: kes(v) })))}
    </div>
    <div class="toolbar">
      <input id="i-q" type="search" placeholder="Search name, SKU, barcode, category…">
      <select id="i-state">
        <option value="">All products</option><option value="alerts">Needs attention (low + out)</option>
        <option value="low">Low stock</option><option value="out">Out of stock</option><option value="ok">In stock</option>
      </select>
    </div>
    <div id="i-bulk"></div>
    <div class="table-wrap" id="i-table"></div>`;
  $('#i-state', root).value = params.state || '';

  const cols = [
    { key: 'sku', label: 'SKU', render: (p) => esc(p.sku || '—') },
    { key: 'name', label: 'Name', render: (p) => `<b>${esc(p.name)}</b>` },
    { key: 'category_name', label: 'Category', render: (p) => esc(p.category_name || '—') },
    { key: 'stock_qty', label: 'Qty', value: (p) => num(p.stock_qty) },
    { key: 'low_stock_threshold', label: 'Min', value: (p) => num(p.low_stock_threshold ?? 5) },
    { key: 'cost_kes', label: 'Buying', value: (p) => num(p.cost_kes), render: (p) => kes(p.cost_kes) },
    { key: 'price_kes', label: 'Selling', value: (p) => num(p.price_kes), render: (p) => kes(p.price_kes) },
    { key: 'sv', label: 'Stock value', value: stockValue, render: (p) => kes(stockValue(p)) },
    { key: 'state', label: 'Status', value: stateOf, render: statePill },
    { key: 'a', label: '', sortable: false, csv: false, cls: 'right', render: () => `
      <div class="row-actions">
        <button class="btn btn-sm" data-act="stock"><i data-lucide="package"></i> Adjust</button>
        <button class="btn btn-sm btn-soft" data-act="po"><i data-lucide="truck"></i> Reorder</button>
      </div>` }
  ];
  const showBulk = bulkBar($('#i-bulk', root), [
    { id: 'po', icon: 'truck', text: 'Create PO for selected', run: (sel) => openPOModal(null, sel.map((p) => p.id)) }
  ]);
  const t = mountTable($('#i-table', root), {
    columns: cols, rows: [], pageSize: 20, empty: 'No products match', selectable: true, onSelect: showBulk,
    rowClass: (p) => (stateOf(p) === 'archived' ? 'dim' : ''),
    onAction: (a, p) => (a === 'stock' ? openStockModal(p) : openPOModal(p.id))
  });
  const apply = () => {
    const q = $('#i-q', root).value, st = $('#i-state', root).value;
    t.setRows(products.filter((p) => {
      const s = stateOf(p);
      return (!st || s === st || (st === 'alerts' && (s === 'low' || s === 'out'))) && matches(p, q);
    }));
  };
  $('#i-q', root).oninput = debounce(apply, 150);
  $('#i-state', root).onchange = apply;
  $('#i-export', root).onclick = () => exportCSV('inventory', cols, t.rows());
  $('#i-po', root).onclick = () => openPOModal();
  apply();
}

async function renderSales(root) {

    const [d, prev] = await Promise.all([API.adminSalesReport(f, t), API.adminSalesReport(pf, pt).catch(() => null)]);
    last = d;
    const s = d.summary, p = prev?.summary || {};
    const avg = s.order_count ? num(s.revenue) / s.order_count : 0;
    const mg = num(s.revenue) ? Math.round(num(s.gross_profit) / num(s.revenue) * 100) : 0;

        ${statCard({ icon: 'banknote', label: 'Revenue', value: kes(s.revenue), sub: vs(s.revenue, p.revenue) })}
        ${statCard({ icon: 'piggy-bank', label: 'Gross profit', value: kes(s.gross_profit), sub: `${mg}% margin ${vs(s.gross_profit, p.gross_profit)}` })}
        ${statCard({ icon: 'receipt', label: 'Expenses', value: kes(s.total_expenses), sub: vs(s.total_expenses, p.total_expenses) })}
        ${statCard({ icon: 'scale', label: 'Net profit', value: `<span class="${num(s.net_profit) < 0 ? 'neg' : ''}">${kes(s.net_profit)}</span>`, sub: vs(s.net_profit, p.net_profit) })}
      </div>

        <div class="card"><div class="card-head"><h2>By payment method</h2></div>

        <div class="card"><div class="card-head"><h2>Top products</h2></div>
          ${hbars((d.top_products || []).slice(0, 8).map((r) => ({ label: r.product_name, value: num(r.revenue), display: kes(r.revenue), sub: `${r.qty_sold} sold` })))}</div>

}

/* prefillProductId: single product; prefillIds: many products, or "all low stock" via button */
async function openPOModal(prefillProductId, prefillIds = []) {
  await guarded(async () => {
    const [sup, prods] = await Promise.all([API.adminSuppliers(), API.adminProducts({ limit: 1000 })]);
    if (!sup.suppliers.length) return toast('Add a supplier first', 'error');
    const active = prods.products.filter((p) => stateOf(p) !== 'archived');
    const byId = new Map(active.map((p) => [String(p.id), p]));
    const lines = [];
    const suggest = (p) => Math.max(num(p.low_stock_threshold ?? 5) * 2 - num(p.stock_qty), 5);

    openModal(`
      <h2>New purchase order</h2>
      <form id="po-form">
        <div class="form-group"><label>Supplier</label><select name="supplier_id" required>${sup.suppliers.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
        <div class="form-group"><label>Product</label>
          <select id="po-product">${active.map((p) => `<option value="${p.id}" ${String(p.id) === String(prefillProductId) ? 'selected' : ''}>${esc(p.name)} (${esc(p.sku || 'no SKU')}) · ${esc(p.stock_qty)} in stock</option>`).join('')}</select></div>
        <div class="form-row">
          <div class="form-group"><label>Quantity</label><input type="number" id="po-qty" value="10" min="1"></div>
          <div class="form-group"><label>Unit cost (KES)</label><input type="number" id="po-cost" step="0.01" min="0"></div>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-sm" id="po-add"><i data-lucide="plus"></i> Add line</button>
          <button type="button" class="btn btn-sm btn-soft" id="po-low"><i data-lucide="wand-sparkles"></i> Add all low / out of stock</button>
        </div>
        <div class="table-wrap" style="margin-top:.8rem"><table><tbody id="po-lines"></tbody></table></div>
        <div class="modal-actions">
          <span style="margin-right:auto;font-weight:700" id="po-total"></span>
          <button type="button" class="btn" id="c">Cancel</button><button class="btn btn-primary">Create PO</button>
        </div>
      </form>`, 'wide');

    const sel = $('#po-product');
    const sync = () => { $('#po-cost').value = byId.get(sel.value)?.cost_kes || 0; };
    sync(); sel.onchange = sync;

    const drawLines = () => {
      $('#po-lines').innerHTML = lines.length
        ? lines.map((l, i) => `<tr><td>${esc(l.name)}</td>
            <td><input type="number" min="1" value="${l.quantity}" data-q="${i}" style="width:80px"></td>
            <td>× ${kes(l.unit_cost_kes)}</td><td class="right"><b>${kes(l.quantity * l.unit_cost_kes)}</b></td>
            <td class="right"><button type="button" class="btn btn-sm btn-danger" data-rm="${i}"><i data-lucide="x"></i></button></td></tr>`).join('')
        : '<tr><td class="empty">No lines yet</td></tr>';
      $('#po-total').textContent = lines.length ? `Total ${kes(lines.reduce((s, l) => s + l.quantity * l.unit_cost_kes, 0))}` : '';
      $$('[data-rm]', $('#po-lines')).forEach((b) => { b.onclick = () => { lines.splice(Number(b.dataset.rm), 1); drawLines(); }; });
      $$('[data-q]', $('#po-lines')).forEach((inp) => {
        inp.onchange = () => { lines[Number(inp.dataset.q)].quantity = Math.max(1, num(inp.value)); drawLines(); };
      });
      icons($('#po-lines'));
    };
    const addLine = (p, qty) => {
      const existing = lines.find((l) => l.product_id === Number(p.id));
      if (existing) existing.quantity += qty;
      else lines.push({ product_id: Number(p.id), quantity: qty, unit_cost_kes: num(p.cost_kes), name: p.name });
    };

    $('#po-add').onclick = () => {
      const q = num($('#po-qty').value);
      if (!(q > 0)) return toast('Quantity must be at least 1', 'error');
      const p = byId.get(sel.value);
      lines.push({ product_id: Number(sel.value), quantity: q, unit_cost_kes: num($('#po-cost').value), name: p ? p.name : 'Product' });
      drawLines();
    };
    $('#po-low').onclick = () => {
      const need = active.filter((p) => ['low', 'out'].includes(stateOf(p)));
      if (!need.length) return toast('Nothing is low on stock');
      need.forEach((p) => { if (!lines.some((l) => l.product_id === Number(p.id))) addLine(p, suggest(p)); });
      drawLines();
    };

    if (prefillProductId && byId.get(String(prefillProductId))) { addLine(byId.get(String(prefillProductId)), suggest(byId.get(String(prefillProductId)))); }
    prefillIds.forEach((id) => { const p = byId.get(String(id)); if (p) addLine(p, suggest(p)); });
    drawLines();

    $('#c').onclick = closeModal;
    $('#po-form').onsubmit = (e) => {
      e.preventDefault();
      if (!lines.length) return toast('Add at least one line', 'error');
      guarded(async () => {
        await API.adminCreatePO({
          supplier_id: Number(new FormData(e.target).get('supplier_id')),
          items: lines.map(({ product_id, quantity, unit_cost_kes }) => ({ product_id, quantity, unit_cost_kes }))
        });
        closeModal(); toast('Purchase order created');
        if (parseHash().view === 'suppliers' && parseHash().params.tab !== 'suppliers') route(); else go('suppliers', { tab: 'pos' });
      });
    };
  });
}

const MKT_TABS = ['overview', 'subscribers', 'campaigns', 'promos'];
let MK = { subs: [], campaigns: [], promos: [], stats: {}, sales: null, pnl: null, failed: [], at: null };

const normSub = (s, i) => {
  const email = s.email || s.email_address || '';
  const raw = String(s.status || '').toLowerCase();
  const off = s.unsubscribed || s.blacklisted || s.emailBlacklisted || s.is_active === 0 || s.is_active === false;
  return {
    ...s, id: s.id ?? (email || i), email,
    name: [s.first_name || s.firstName, s.last_name || s.lastName].filter(Boolean).join(' ') || s.name || s.full_name || '',
    status: off ? 'unsubscribed' : (raw && raw !== 'subscribed' ? raw : 'active'),
    date: s.created_at || s.subscribed_at || s.createdAt || s.date || '', source: s.source || ''
  };
};
const normCamp = (c, i) => ({
  ...c, id: c.id ?? i, subject: c.subject || c.name || 'Untitled', status: String(c.status || 'draft').toLowerCase(),
  sent: num(c.sent_count ?? c.recipients ?? c.sent), open: c.open_rate ?? null, click: c.click_rate ?? null,
  created: c.created_at || c.createdAt || c.scheduled_at || ''
});

async function mktData() {
  const now = new Date();
  const from = ymd(new Date(now.getFullYear(), now.getMonth(), 1)), to = ymd(now);
  const failed = [];
  const safe = (name, p, fb) => p.catch(() => { failed.push(name); return fb; });
  const [stats, campaigns, subs, promos, sales, pnl] = await Promise.all([
    safe('newsletter stats', API.adminNewsletterStats(), {}),
    safe('campaigns', API.adminNewsletterCampaigns(), []),
    safe('subscribers', API.adminNewsletterSubscribers({ limit: 5000 }), []),
    safe('promotions', API.adminPromos(), { promos: [] }),
    can('sales') ? safe('sales', API.adminSalesReport(from, to), null) : Promise.resolve(null),
    can('pnl') ? safe('profit & loss', API.adminProfitLoss(from, to), null) : Promise.resolve(null)
  ]);
  MK = {
    stats: stats || {}, campaigns: arr(campaigns, 'campaigns').map(normCamp),
    subs: arr(subs, 'subscribers').map(normSub), promos: arr(promos, 'promos').map(normPromo),
    sales, pnl, failed, at: new Date()
  };
}
const activeSubs = () => MK.subs.filter((s) => s.status === 'active');
const activePromos = () => MK.promos.filter((p) => p.state === 'active');
const subCount = () => activeSubs().length || num(MK.stats.active_subscribers ?? MK.stats.total_subscribers ?? MK.stats.subscribers);

    <div class="chips">

      ${o.statuses.map((s) => `<button class="chip" data-s="${esc(s)}">${esc(label(s))} <b>${count(s)}</b></button>`).join('')}
    </div>
    <div class="toolbar">
      <input type="search" class="ml-q" placeholder="${esc(o.placeholder || 'Search…')}" value="${esc(o.q || '')}">
      ${o.toolbar || ''}
      <button class="btn btn-sm" id="ml-export"><i data-lucide="download"></i> Export CSV</button>
    </div>
    <div class="table-wrap" id="ml-table"></div>`;
  icons(body);
  let visible = o.rows;
  const t = mountTable($('#ml-table', body), {
    columns: o.columns, rows: [], pageSize: 15, sort: o.sort, dir: o.dir || 'desc',
    empty: o.empty, onRow: o.onRow, onAction: o.onAction, rowClass: o.rowClass
  });
  const apply = () => {
    const q = $('.ml-q', body).value.trim().toLowerCase();
    visible = o.rows.filter((r) => (!filter || o.statusOf(r) === filter) && (!q || o.search(r).toLowerCase().includes(q)));
    t.setRows(visible);
    $$('.chip', body).forEach((c) => c.classList.toggle('on', c.dataset.s === filter));
  };
  $$('.chip', body).forEach((c) => { c.onclick = () => { filter = c.dataset.s; apply(); }; });
  $('.ml-q', body).oninput = debounce(apply, 150);
  $('#ml-export', body).onclick = () => exportCSV(o.exportName, o.columns, visible);
  apply();
  return { visible: () => visible };
}

function mktOverview(body) {

  const soon = act.filter((p) => p.expires_at && new Date(p.expires_at) - Date.now() < 7 * DAY).sort((a, b) => new Date(a.expires_at) - new Date(b.expires_at));
  const watch = soon.length ? soon : act.slice(0, 5);
  const M = (tab, extra = {}) => link('marketing', { tab, ...extra });
  const rev = num(MK.sales?.summary?.revenue);
  const net = num(MK.pnl?.net_profit ?? MK.sales?.summary?.net_profit);

  const now = new Date();
  const months = [...Array(6)].map((_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    return { key: ymd(d).slice(0, 7), name: d.toLocaleDateString('en', { month: 'short', year: '2-digit' }), n: 0 };
  });
  MK.subs.forEach((s) => { const m = months.find((x) => x.key === String(s.date).slice(0, 7)); if (m) m.n++; });
  const newest = [...MK.subs].sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 6);
  const totalSubs = num(st.active_subscribers ?? st.total_subscribers ?? st.subscribers) || activeSubs().length;

  body.innerHTML = `
    <div class="grid-stats">
      ${statCard({ href: M('subscribers'), icon: 'users', label: 'Newsletter subscribers', value: totalSubs.toLocaleString(), sub: `${MK.subs.filter((s) => s.status === 'unsubscribed').length} unsubscribed` })}
      ${statCard({ href: M('promos', { filter: 'active' }), icon: 'ticket-percent', label: 'Active promotions', value: act.length, sub: `${soon.length} expiring within 7 days`, tone: soon.length ? 'warn' : '' })}
      ${statCard({ href: M('promos'), icon: 'badge-percent', label: 'Coupon redemptions', value: redemptions.toLocaleString(), sub: 'All coupons, all time' })}
      ${statCard({ href: M('campaigns', { filter: 'sent' }), icon: 'send', label: 'Campaigns sent', value: sentN, sub: 'View sent campaigns', tone: 'info' })}
      ${statCard({ href: M('campaigns', { filter: 'draft' }), icon: 'file-text', label: 'Draft campaigns', value: draftN, sub: draftN ? 'Ready to review & send' : 'No drafts' })}
      ${statCard({ href: M('campaigns'), icon: 'mail-open', label: 'Open rate', value: pct(st.open_rate), sub: 'Average across campaigns' })}
      ${statCard({ href: M('campaigns'), icon: 'mouse-pointer-click', label: 'Click rate', value: pct(st.click_rate), sub: 'Average across campaigns' })}
      ${MK.sales ? statCard({ href: link('sales'), icon: 'banknote', label: 'Revenue (this month)', value: kes(rev), sub: `${num(MK.sales.summary?.order_count)} orders`, tone: 'info' }) : ''}
      ${MK.pnl ? statCard({ href: link('pnl'), icon: 'scale', label: 'Net profit (this month)', value: `<span class="${net < 0 ? 'neg' : 'pos'}">${kes(net)}</span>`, sub: 'After expenses', tone: net < 0 ? 'bad' : '' }) : ''}
    </div>
    <div class="cols">
      <div class="card">
        <div class="card-head"><h2>Newest subscribers</h2><a class="btn btn-sm" href="${M('subscribers')}">View all</a></div>
        ${newest.length ? `<ul class="mini-list">${newest.map((s) => `<li data-sid="${esc(s.id)}"><b>${esc(s.name || s.email)}</b><span class="hint">${esc(fdate(s.date))}</span></li>`).join('')}</ul>` : '<p class="muted">No subscribers yet</p>'}
      </div>
      <div class="card">
        <div class="card-head"><h2>Subscriber growth (6 months)</h2></div>
        ${hbars(months.map((m) => ({ label: m.name, value: m.n, display: `+${m.n}` })))}
      </div>
    </div>
    <div class="cols">
      <div class="card">
        <div class="card-head"><h2>Recent campaigns</h2><a class="btn btn-sm" href="${M('campaigns')}">Open studio</a></div>
        ${MK.campaigns.length ? hbars([...MK.campaigns].sort((a, b) => String(b.created).localeCompare(String(a.created))).slice(0, 5).map((c) => ({ label: c.subject, value: c.sent, display: `${c.sent} sent`, sub: label(c.status) }))) : '<p class="muted">No campaigns yet — create your first newsletter.</p>'}
      </div>
