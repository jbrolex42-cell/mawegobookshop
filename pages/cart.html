
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Your Basket | Mawego Bookshop</title>
  <meta
    name="description"
    content="Review your selected books, update quantities and proceed securely to checkout at Mawego Bookshop."
  >
  <meta name="theme-color" content="#126b45">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">

  <script src="https://unpkg.com/lucide@0.469.0"></script>

  <style>
    :root {
      --cart-green: #126b45;
      --cart-green-dark: #0b5033;
      --cart-soft: #eef8f1;
      --cart-border: #e5eae7;
      --cart-muted: #68756d;
      --cart-danger: #b42318;
    }

    .cart-page {
      max-width: 1120px;
      margin: 0 auto;
    }

    .cart-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .cart-heading h1 {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0;
      font-family: var(--font-display);
      letter-spacing: -.03em;
    }

    .cart-subtitle {
      margin: .4rem 0 0;
      color: var(--cart-muted);
      font-size: .94rem;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 1.25rem;
      align-items: start;
    }

    .cart-panel,
    .cart-summary {
      background: var(--surface, #fff);
      border: 1px solid var(--cart-border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 5px 20px rgba(20, 50, 35, .045);
    }

    .cart-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: 1rem;
    }

    .cart-panel-header h2,
    .cart-summary h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .cart-item-count {
      color: var(--cart-muted);
      font-size: .85rem;
    }

    .cart-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 570px;
    }

    .cart-table th {
      text-align: left;
      padding: .8rem .65rem;
      font-size: .77rem;
      color: var(--cart-muted);
      text-transform: uppercase;
      letter-spacing: .045em;
      border-bottom: 1px solid var(--cart-border);
      white-space: nowrap;
    }

    .cart-table td {
      padding: 1rem .65rem;
      border-bottom: 1px solid var(--cart-border);
      vertical-align: middle;
    }

    .cart-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .cart-product-name {
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .cart-product-meta {
      margin-top: .25rem;
      color: var(--cart-muted);
      font-size: .78rem;
    }

    .cart-price {
      white-space: nowrap;
      font-weight: 600;
    }

    .cart-price-old {
      display: block;
      color: var(--cart-muted);
      text-decoration: line-through;
      font-size: .8rem;
      font-weight: 400;
    }

    .cart-price-current {
      color: var(--cart-green);
    }

    .cart-quantity {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      padding: .25rem;
      border: 1px solid var(--cart-border);
      border-radius: 10px;
      background: #fff;
    }

    .cart-quantity button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: #f3f6f4;
      color: var(--cart-green-dark);
      cursor: pointer;
    }

    .cart-quantity button:hover {
      background: var(--cart-soft);
    }

    .cart-quantity button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .cart-quantity input {
      width: 42px;
      padding: .25rem 0;
      border: 0;
      outline: none;
      text-align: center;
      font: inherit;
      font-size: .9rem;
      background: transparent;
    }

    .cart-quantity input::-webkit-inner-spin-button,
    .cart-quantity input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .cart-quantity input[type="number"] {
      -moz-appearance: textfield;
    }

    .cart-line-total {
      white-space: nowrap;
      font-weight: 750;
    }

    .cart-remove {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #f1d6d4;
      border-radius: 9px;
      background: #fff;
      color: var(--cart-danger);
      cursor: pointer;
    }

    .cart-remove:hover {
      background: #fff1f0;
    }

    .cart-panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--cart-border);
      padding-top: 1rem;
      margin-top: .5rem;
    }

    .cart-text-button {
      border: 0;
      padding: .4rem 0;
      background: transparent;
      color: var(--cart-danger);
      font: inherit;
      font-size: .87rem;
      cursor: pointer;
    }

    .cart-text-button:hover {
      text-decoration: underline;
    }

    .cart-summary {
      position: sticky;
      top: 1rem;
    }

    .cart-summary h2 {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.1rem;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: .85rem 0;
      font-size: .93rem;
    }

    .summary-row span:first-child {
      color: var(--cart-muted);
    }

    .summary-row strong {
      text-align: right;
    }

    .summary-divider {
      border: 0;
      border-top: 1px solid var(--cart-border);
      margin: 1rem 0;
    }

    .summary-total {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--cart-green-dark);
    }

    .delivery-notice {
      display: flex;
      gap: .65rem;
      align-items: flex-start;
      padding: .85rem;
      margin: 1rem 0;
      border-radius: 11px;
      background: var(--cart-soft);
      color: var(--cart-green-dark);
      font-size: .82rem;
      line-height: 1.5;
    }

    .delivery-notice svg {
      flex-shrink: 0;
      margin-top: 2px;
    }

    .cart-checkout-btn {
      width: 100%;
      justify-content: center;
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-top: 1rem;
    }

    .cart-continue-btn {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .5rem;
      margin-top: .65rem;
    }

    .cart-trust {
      display: grid;
      gap: .65rem;
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--cart-border);
      color: var(--cart-muted);
      font-size: .8rem;
    }

    .cart-trust div {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .cart-trust svg {
      color: var(--cart-green);
    }

    .cart-empty {
      max-width: 560px;
      margin: 2rem auto;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    .cart-empty-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: var(--cart-soft);
      color: var(--cart-green);
    }

    .cart-empty-icon svg {
      width: 34px;
      height: 34px;
    }

    .cart-empty h2 {
      margin: 0 0 .5rem;
    }

    .cart-empty p {
      color: var(--cart-muted);
      line-height: 1.6;
      margin: 0 0 1.25rem;
    }

    .cart-error {
      max-width: 560px;
      margin: 2rem auto;
      padding: 1.5rem;
      text-align: center;
    }

    .cart-error p {
      color: var(--cart-muted);
      line-height: 1.6;
    }

    .cart-footer {
      margin-top: 3rem;
    }

    @media (max-width: 850px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-summary {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .cart-panel,
      .cart-summary {
        padding: 1rem;
        border-radius: 13px;
      }

      .cart-heading {
        align-items: flex-start;
      }

      .cart-heading h1 {
        font-size: 1.65rem;
      }

      .cart-panel-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <a href="/" class="logo" aria-label="Mawego Bookshop home">
        <span class="logo-mark" aria-hidden="true">
          <i data-lucide="book-open"></i>
        </span>
        Mawego <span>Bookshop</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="/">
          <i data-lucide="store"></i>
          Shop
        </a>

        <a href="/pages/track.html">
          <i data-lucide="map-pin"></i>
          Track
        </a>

        <a href="/pages/account.html">
          <i data-lucide="user"></i>
          Account
        </a>

        <a href="/pages/cart.html" class="cart-btn active" aria-current="page">
          <i data-lucide="shopping-bag"></i>
          Basket
          <span class="cart-count">0</span>
        </a>
      </nav>

    </div>
  </header>


  <main class="container page-pad cart-page">

    <div class="cart-heading">
      <div>
        <h1>
          <i data-lucide="shopping-bag"></i>
          Your basket
        </h1>
        <p class="cart-subtitle">
          Review your books and get ready to checkout.
        </p>
      </div>

      <a href="/" class="btn btn-outline">
        <i data-lucide="arrow-left"></i>
        Continue shopping
      </a>
    </div>

    <div id="cart-content" aria-live="polite" aria-busy="true">
      <div class="card" style="padding:2rem;text-align:center">
        Loading your basket...
      </div>
    </div>

  </main>


  <footer class="site-footer cart-footer">
    <div class="container footer-bottom">
      <span>© <span id="footer-year"></span> Mawego Bookshop</span>
      <span>Prices displayed in KES</span>
      <a href="/pages/contact.html">Contact us</a>
    </div>
  </footer>


  <script src="/js/api.js"></script>
  <script src="/js/notifications.js"></script>

  <script>
    'use strict';

    (() => {
      const FREE_DELIVERY_THRESHOLD = 2000;
      const DELIVERY_FEE = 200;

      const content = document.getElementById('cart-content');

      document.getElementById('footer-year').textContent =
        new Date().getFullYear();

      function refreshIcons() {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      function escape(value) {
        if (typeof window.escapeHtml === 'function') {
          return window.escapeHtml(String(value ?? ''));
        }

        return String(value ?? '').replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      function money(amount) {
        const value = Number(amount) || 0;

        if (typeof window.formatKes === 'function') {
          return window.formatKes(value);
        }

        return 'KES ' + value.toLocaleString('en-KE');
      }

      function getCartItems() {
        if (typeof window.Cart === 'undefined') {
          throw new Error('The basket service is unavailable. Please reload the page.');
        }

        const items = window.Cart.get();

        return Array.isArray(items) ? items : [];
      }

      function getSubtotal(items) {
        if (typeof window.Cart.subtotal === 'function') {
          return Math.max(0, Number(window.Cart.subtotal()) || 0);
        }

        return items.reduce((sum, item) => {
          const price = Math.max(0, Number(item.price_kes) || 0);
          const quantity = Math.max(0, Number(item.quantity) || 0);

          return sum + price * quantity;
        }, 0);
      }

      function getDelivery(subtotal) {
        return subtotal >= FREE_DELIVERY_THRESHOLD ? 0 : DELIVERY_FEE;
      }

      function updateBasketCount(items) {
        const count = items.reduce((sum, item) => {
          return sum + Math.max(0, Number(item.quantity) || 0);
        }, 0);

        document.querySelectorAll('.cart-count').forEach(element => {
          element.textContent = count;
        });
      }

      function renderEmpty() {
        content.setAttribute('aria-busy', 'false');

        content.innerHTML = `
          <section class="card cart-empty">
            <div class="cart-empty-icon">
              <i data-lucide="shopping-basket"></i>
            </div>

            <h2>Your basket is empty</h2>

            <p>
              You haven't added any books or products yet.
              Explore our collection and find what you need.
            </p>

            <a href="/" class="btn btn-primary">
              <i data-lucide="store"></i>
              Browse the shop
            </a>
          </section>
        `;

        updateBasketCount([]);
        refreshIcons();
      }

      function renderError(error) {
        console.error('Basket error:', error);

        content.setAttribute('aria-busy', 'false');

        content.innerHTML = `
          <section class="card cart-error">
            <div class="cart-empty-icon">
              <i data-lucide="alert-circle"></i>
            </div>

            <h2>Unable to load your basket</h2>

            <p>
              Something went wrong while displaying your basket.
              Please try again.
            </p>

            <button type="button" class="btn btn-primary" data-retry>
              <i data-lucide="refresh-cw"></i>
              Try again
            </button>
          </section>
        `;

        refreshIcons();
      }

      function render() {
        try {
          const items = getCartItems();

          updateBasketCount(items);

          if (items.length === 0) {
            renderEmpty();
            return;
          }

          const subtotal = getSubtotal(items);
          const delivery = getDelivery(subtotal);
          const total = subtotal + delivery;

          const rows = items.map((item, index) => {
            const productId = String(item.product_id ?? '');

            const quantity = Math.max(
              1,
              Math.floor(Number(item.quantity) || 1)
            );

            const price = Math.max(0, Number(item.price_kes) || 0);

            const originalPrice = Math.max(
              price,
              Number(item.original_price_kes) || price
            );

            const hasSale = Boolean(item.sale_active) &&
              originalPrice > price;

            const name = item.name || 'Unnamed product';

            return `
              <tr data-product-id="${escape(productId)}">
                <td>
                  <div class="cart-product-name">${escape(name)}</div>
                  <div class="cart-product-meta">
                    ${hasSale ? 'Special offer' : 'Mawego Bookshop'}
                  </div>
                </td>

                <td>
                  <div class="cart-price">
                    ${
                      hasSale
                        ? `
                          <span class="cart-price-old">${money(originalPrice)}</span>
                          <span class="cart-price-current">${money(price)}</span>
                        `
                        : money(price)
                    }
                  </div>
                </td>

                <td>
                  <div class="cart-quantity">
                    <button
                      type="button"
                      data-action="decrease"
                      aria-label="Decrease quantity of ${escape(name)}"
                      ${quantity <= 1 ? 'disabled' : ''}
                    >
                      <i data-lucide="minus"></i>
                    </button>

                    <input
                      type="number"
                      min="1"
                      step="1"
                      max="999"
                      value="${quantity}"
                      data-quantity
                      aria-label="Quantity of ${escape(name)}"
                    >

                    <button
                      type="button"
                      data-action="increase"
                      aria-label="Increase quantity of ${escape(name)}"
                    >
                      <i data-lucide="plus"></i>
                    </button>
                  </div>
                </td>

                <td>
                  <strong class="cart-line-total">
                    ${money(price * quantity)}
                  </strong>
                </td>

                <td>
                  <button
                    type="button"
                    class="cart-remove"
                    data-action="remove"
                    aria-label="Remove ${escape(name)} from basket"
                    title="Remove item"
                  >
                    <i data-lucide="trash-2"></i>
                  </button>
                </td>
              </tr>
            `;
          }).join('');

          content.innerHTML = `
            <div class="cart-layout">

              <section class="cart-panel">
                <div class="cart-panel-header">
                  <h2>Your selected products</h2>
                  <span class="cart-item-count">
                    ${items.length} ${items.length === 1 ? 'product' : 'products'}
                  </span>
                </div>

                <div class="cart-table-wrap">
                  <table class="cart-table">
                    <thead>
                      <tr>
                        <th scope="col">Product</th>
                        <th scope="col">Price</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Total</th>
                        <th scope="col"><span class="sr-only">Actions</span></th>
                      </tr>
                    </thead>

                    <tbody>
                      ${rows}
                    </tbody>
                  </table>
                </div>

                <div class="cart-panel-footer">
                  <a href="/" class="btn btn-outline">
                    <i data-lucide="arrow-left"></i>
                    Continue shopping
                  </a>

                  <button type="button" class="cart-text-button" data-action="clear">
                    <i data-lucide="trash-2" style="width:14px;height:14px;vertical-align:middle"></i>
                    Clear basket
                  </button>
                </div>
              </section>

              <aside class="cart-summary">
                <h2>
                  <i data-lucide="receipt"></i>
                  Order summary
                </h2>

                <div class="summary-row">
                  <span>Subtotal</span>
                  <strong>${money(subtotal)}</strong>
                </div>

                <div class="summary-row">
                  <span>Delivery estimate</span>
                  <strong>
                    ${delivery === 0 ? 'FREE' : money(delivery)}
                  </strong>
                </div>

                <div class="delivery-notice">
                  <i data-lucide="truck"></i>
                  <span>
                    ${
                      delivery === 0
                        ? 'Your order qualifies for free delivery. Shop collection is also free.'
                        : `Spend ${money(FREE_DELIVERY_THRESHOLD - subtotal)} more to qualify for free delivery. Collection is always free.`
                    }
                  </span>
                </div>

                <hr class="summary-divider">

                <div class="summary-row summary-total">
                  <span>Estimated total</span>
                  <strong>${money(total)}</strong>
                </div>

                <p style="margin:.5rem 0 0;color:var(--cart-muted);font-size:.78rem;line-height:1.5">
                  Final delivery charges and eligible discounts are confirmed during checkout.
                </p>

                <a href="/pages/checkout.html" class="btn btn-primary cart-checkout-btn">
                  Proceed to checkout
                  <i data-lucide="arrow-right"></i>
                </a>

                <a href="/" class="btn btn-outline cart-continue-btn">
                  <i data-lucide="book-open"></i>
                  Keep shopping
                </a>

                <div class="cart-trust">
                  <div>
                    <i data-lucide="shield-check"></i>
                    Secure order processing
                  </div>

                  <div>
                    <i data-lucide="smartphone"></i>
                    M-Pesa and available payment options
                  </div>

                  <div>
                    <i data-lucide="package-check"></i>
                    Delivery or shop collection
                  </div>
                </div>
              </aside>

            </div>
          `;

          content.setAttribute('aria-busy', 'false');
          refreshIcons();

        } catch (error) {
          renderError(error);
        }
      }

      function findItem(productId) {
        return getCartItems().find(item =>
          String(item.product_id ?? '') === String(productId)
        );
      }

      function changeQuantity(productId, quantity) {
        const item = findItem(productId);

        if (!item) return;

        const newQuantity = Math.min(
          999,
          Math.max(1, Math.floor(Number(quantity) || 1))
        );

        window.Cart.updateQty(String(productId), newQuantity);
        render();
      }

      function removeItem(productId) {
        const item = findItem(productId);

        if (!item) return;

        const name = item.name || 'this product';

        if (!window.confirm(`Remove "${name}" from your basket?`)) {
          return;
        }

        window.Cart.remove(String(productId));
        render();
      }

      function clearBasket() {
        const items = getCartItems();

        if (!items.length) return;

        if (!window.confirm('Are you sure you want to clear your entire basket?')) {
          return;
        }

        window.Cart.clear();
        render();
      }

      content.addEventListener('click', event => {
        const retryButton = event.target.closest('[data-retry]');

        if (retryButton) {
          render();
          return;
        }

        const actionButton = event.target.closest('[data-action]');

        if (!actionButton) return;

        const action = actionButton.dataset.action;

        if (action === 'clear') {
          clearBasket();
          return;
        }

        const row = actionButton.closest('tr[data-product-id]');

        if (!row) return;

        const productId = row.dataset.productId;
        const item = findItem(productId);

        if (!item) return;

        const quantity = Math.max(1, Number(item.quantity) || 1);

        if (action === 'increase') {
          changeQuantity(productId, quantity + 1);
        }

        if (action === 'decrease') {
          if (quantity > 1) {
            changeQuantity(productId, quantity - 1);
          }
        }

        if (action === 'remove') {
          removeItem(productId);
        }
      });

      content.addEventListener('change', event => {
        if (!event.target.matches('[data-quantity]')) return;

        const row = event.target.closest('tr[data-product-id]');

        if (!row) return;

        const productId = row.dataset.productId;
        const quantity = Number.parseInt(event.target.value, 10);

        changeQuantity(productId, quantity);
      });

      render();
    })();
  </script>

</body>
</html>
